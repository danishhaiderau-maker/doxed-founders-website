<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Founder Dragon</title>
  <style>
    :root {
      color-scheme: light dark;
      --signal: #35b779;
      --bubble: rgba(248, 249, 251, 0.94);
      --bubble-text: #17191d;
      --bubble-muted: #60646c;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      user-select: none;
    }
    body {
      display: grid;
      align-items: end;
      padding: 8px;
    }
    .companion {
      display: grid;
      justify-items: end;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .interactive {
      -webkit-app-region: no-drag;
      pointer-events: auto;
      cursor: grab;
    }
    .interactive:active { cursor: grabbing; }
    .task-bubble {
      align-self: start;
      width: min(100%, 344px);
      min-height: 58px;
      padding: 11px 46px 11px 14px;
      border: 1px solid rgba(15, 18, 23, 0.12);
      border-radius: 8px;
      color: var(--bubble-text);
      background: var(--bubble);
      box-shadow: 0 9px 28px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(18px) saturate(1.15);
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .task-tabs {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .task-tab {
      min-height: 17px;
      padding: 2px 6px;
      border-radius: 5px;
      color: var(--bubble-muted);
      background: color-mix(in srgb, var(--bubble-text) 8%, transparent);
      font-size: 8px;
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
    }
    .task-tab.live { color: var(--signal); }
    .task-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .task-title {
      overflow: hidden;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-detail {
      display: -webkit-box;
      margin-top: 2px;
      overflow: hidden;
      color: var(--bubble-muted);
      font-size: 11px;
      line-height: 1.32;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .pulse {
      position: absolute;
      top: 24px;
      right: 23px;
      width: 18px;
      height: 18px;
      border: 3px solid color-mix(in srgb, var(--signal) 36%, transparent);
      border-top-color: var(--signal);
      border-radius: 50%;
      opacity: 0;
    }
    .task-bubble.visible .pulse {
      opacity: 1;
      animation: spin 900ms linear infinite;
    }
    .dragon-stage {
      position: absolute;
      right: 24px;
      bottom: 4px;
      display: grid;
      width: 210px;
      height: 210px;
      isolation: isolate;
      place-items: end center;
      transform-origin: 50% 90%;
    }
    .dragon {
      position: relative;
      z-index: 3;
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.24));
      pointer-events: none;
    }
    .dragon.arriving { animation: state-arrive 240ms cubic-bezier(.2,.8,.2,1) both; }
    .idle .dragon,
    .offline .dragon {
      clip-path: inset(10% 10% 0 0);
    }
    .nest-light {
      position: absolute;
      z-index: 0;
      right: 31px;
      bottom: 12px;
      width: 146px;
      height: 30px;
      border-radius: 50%;
      background: rgba(228, 168, 83, 0.13);
      box-shadow: 0 0 20px rgba(228, 168, 83, 0.2);
      opacity: 0;
      transform: scale(.78);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }
    .idle .nest-light {
      opacity: 1;
      transform: scale(1);
      animation: nest-warmth 3.6s ease-in-out infinite;
    }
    .motion-trails,
    .signal-rings,
    .delivery-embers,
    .coordination-orbit {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }
    .motion-trails span {
      position: absolute;
      left: 13px;
      width: 78px;
      height: 2px;
      border-radius: 2px;
      background: rgba(47, 128, 237, 0.58);
      transform: translateX(-22px);
    }
    .motion-trails span:nth-child(1) { top: 72px; animation-delay: -260ms; }
    .motion-trails span:nth-child(2) { top: 101px; width: 56px; animation-delay: -520ms; }
    .motion-trails span:nth-child(3) { top: 132px; width: 68px; animation-delay: -80ms; }
    .working .motion-trails,
    .coordinating .motion-trails { opacity: 1; }
    .working .motion-trails span,
    .coordinating .motion-trails span { animation: trail-pass 720ms ease-in infinite; }
    .signal-rings::before,
    .signal-rings::after {
      position: absolute;
      top: 45px;
      right: 24px;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(47, 128, 237, 0.54);
      border-radius: 50%;
      content: "";
    }
    .signal-rings::after { animation-delay: -700ms; }
    .listening .signal-rings,
    .planning .signal-rings,
    .verifying .signal-rings,
    .attention .signal-rings,
    .update .signal-rings { opacity: 1; }
    .listening .signal-rings::before,
    .listening .signal-rings::after,
    .planning .signal-rings::before,
    .planning .signal-rings::after,
    .verifying .signal-rings::before,
    .verifying .signal-rings::after,
    .attention .signal-rings::before,
    .attention .signal-rings::after,
    .update .signal-rings::before,
    .update .signal-rings::after { animation: signal-expand 1.4s ease-out infinite; }
    .planning .signal-rings::before,
    .planning .signal-rings::after,
    .verifying .signal-rings::before,
    .verifying .signal-rings::after,
    .attention .signal-rings::before,
    .attention .signal-rings::after,
    .update .signal-rings::before,
    .update .signal-rings::after { border-color: rgba(228, 168, 83, 0.58); }
    .coordination-orbit {
      inset: 32px 18px 20px 18px;
      overflow: visible;
      border: 1px solid rgba(47, 128, 237, 0.28);
      border-radius: 50%;
    }
    .coordination-orbit::before,
    .coordination-orbit::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin: -4px;
      border-radius: 50%;
      background: #5aa0f2;
      box-shadow: 0 0 9px rgba(47, 128, 237, 0.74);
      content: "";
    }
    .coordination-orbit::after { animation-delay: -900ms; }
    .coordinating .coordination-orbit { opacity: 1; }
    .coordinating .coordination-orbit::before,
    .coordinating .coordination-orbit::after { animation: orbit-node 1.8s linear infinite; }
    .delivery-embers span {
      position: absolute;
      left: 28px;
      bottom: 88px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffb341;
      box-shadow: 0 0 8px rgba(255, 126, 34, 0.9);
    }
    .delivery-embers span:nth-child(1) { animation-delay: -120ms; }
    .delivery-embers span:nth-child(2) { left: 49px; animation-delay: -430ms; }
    .delivery-embers span:nth-child(3) { left: 73px; animation-delay: -720ms; }
    .success .delivery-embers { opacity: 1; }
    .success .delivery-embers span { animation: ember-rise 1.15s ease-out infinite; }
    .idle .dragon-stage { animation: breathe 3.6s ease-in-out infinite; }
    .listening .dragon-stage { animation: listen 1.35s ease-in-out infinite; }
    .planning .dragon-stage { animation: plan 1.8s ease-in-out infinite; }
    .working .dragon-stage { animation: fly 760ms ease-in-out infinite alternate; }
    .coordinating .dragon-stage { animation: coordinate 1.05s ease-in-out infinite alternate; }
    .verifying .dragon-stage { animation: verify 820ms ease-in-out infinite alternate; }
    .success .dragon-stage { animation: deliver 680ms cubic-bezier(.2,.8,.2,1) both; }
    .success .dragon { filter: none; }
    .attention .dragon-stage { animation: alert 1.2s ease-in-out infinite; }
    .error .dragon-stage { animation: blocked 560ms ease-in-out 2; filter: saturate(.72); }
    .offline .dragon-stage { animation: none; filter: grayscale(.82) opacity(.76); }
    .update .dragon-stage { animation: alert 1.2s ease-in-out infinite; }
    .listening, .working, .coordinating { --signal: #2f80ed; }
    .planning, .verifying, .attention, .update { --signal: #e4a853; }
    .success { --signal: #35b779; }
    .error { --signal: #e45b5b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes state-arrive {
      from { opacity: .28; transform: translateY(5px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes nest-warmth {
      0%, 100% { opacity: .64; transform: scale(.92); }
      50% { opacity: 1; transform: scale(1.04); }
    }
    @keyframes trail-pass {
      0% { opacity: 0; transform: translateX(-24px) scaleX(.35); }
      32% { opacity: .9; }
      100% { opacity: 0; transform: translateX(72px) scaleX(1.08); }
    }
    @keyframes signal-expand {
      0% { opacity: .72; transform: scale(.48); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    @keyframes orbit-node {
      from { transform: rotate(0deg) translateX(76px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(76px) rotate(-360deg); }
    }
    @keyframes ember-rise {
      0% { opacity: 0; transform: translate3d(0, 8px, 0) scale(.5); }
      28% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(-16px, -52px, 0) scale(1.25); }
    }
    @keyframes breathe {
      0%, 100% { transform: translateY(2px) scale(0.985); }
      50% { transform: translateY(-2px) scale(1.015); }
    }
    @keyframes fly {
      from { transform: translate3d(-4px, 6px, 0) rotate(-1.5deg) scale(0.98); }
      to { transform: translate3d(5px, -8px, 0) rotate(1.5deg) scale(1.035); }
    }
    @keyframes listen {
      0%, 100% { transform: rotate(-1deg) translateY(1px); }
      50% { transform: rotate(1deg) translateY(-3px) scale(1.02); }
    }
    @keyframes plan {
      0%, 100% { transform: translateY(2px) scale(.985); filter: brightness(.92); }
      50% { transform: translateY(-3px) scale(1.02); filter: brightness(1.08); }
    }
    @keyframes coordinate {
      from { transform: translate3d(-7px, 3px, 0) rotate(-2deg); }
      to { transform: translate3d(7px, -5px, 0) rotate(2deg); }
    }
    @keyframes verify {
      from { transform: translateY(2px) scale(.97); filter: saturate(.82); }
      to { transform: translateY(-4px) scale(1.025); filter: saturate(1.2); }
    }
    @keyframes deliver {
      0% { transform: translateY(14px) scale(.9); opacity: .5; }
      62% { transform: translateY(-4px) scale(1.055); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes alert {
      0%, 100% { transform: rotate(-1deg) translateY(1px); }
      50% { transform: rotate(1deg) translateY(-4px); }
    }
    @keyframes blocked {
      0%, 100% { transform: translateX(0); }
      33% { transform: translateX(-5px); }
      66% { transform: translateX(5px); }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bubble: rgba(30, 33, 39, 0.94);
        --bubble-text: #f4f5f7;
        --bubble-muted: #b1b4ba;
      }
      .task-bubble { border-color: rgba(255, 255, 255, 0.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dragon-stage, .dragon, .pulse,
      .nest-light, .motion-trails span, .signal-rings::before,
      .signal-rings::after, .coordination-orbit::before,
      .coordination-orbit::after, .delivery-embers span { animation: none !important; }
      .task-bubble { transition: none; }
    }
    .reduced-motion .dragon-stage, .reduced-motion .dragon,
    .reduced-motion .pulse, .reduced-motion .nest-light,
    .reduced-motion .motion-trails span,
    .reduced-motion .signal-rings::before,
    .reduced-motion .signal-rings::after,
    .reduced-motion .coordination-orbit::before,
    .reduced-motion .coordination-orbit::after,
    .reduced-motion .delivery-embers span { animation: none !important; }
    .reduced-motion .task-bubble { transition: none; }
  </style>
</head>
<body>
  <main class="companion idle" data-companion>
    <section class="task-bubble interactive" data-bubble>
      <div class="task-tabs"><span class="task-tab">Founder</span><span class="task-tab live" data-state>Ready</span></div>
      <div class="task-title" data-title>Founder is ready</div>
      <div class="task-detail" data-detail>Watching this workspace.</div>
      <span class="pulse" aria-hidden="true"></span>
    </section>
    <section class="dragon-stage interactive" data-dragon-stage aria-label="Founder Dragon">
      <span class="nest-light" aria-hidden="true"></span>
      <span class="motion-trails" aria-hidden="true"><span></span><span></span><span></span></span>
      <span class="signal-rings" aria-hidden="true"></span>
      <span class="coordination-orbit" aria-hidden="true"></span>
      <span class="delivery-embers" aria-hidden="true"><span></span><span></span><span></span></span>
      <img class="dragon" data-dragon alt="" src="dragon-idle.png">
    </section>
  </main>
  <script>
    const api = window.founderCompanion;
    const root = document.querySelector('[data-companion]');
    const bubble = document.querySelector('[data-bubble]');
    const title = document.querySelector('[data-title]');
    const detail = document.querySelector('[data-detail]');
    const stateLabel = document.querySelector('[data-state]');
    const dragon = document.querySelector('[data-dragon]');
    const images = {
      idle: 'dragon-idle.png',
      listening: 'dragon-attention.png',
      planning: 'dragon-attention.png',
      working: 'dragon-working.png',
      coordinating: 'dragon-working.png',
      verifying: 'dragon-working.png',
      success: 'dragon-success-v3.png',
      attention: 'dragon-attention.png',
      error: 'dragon-attention.png',
      offline: 'dragon-idle.png',
      update: 'dragon-attention.png',
    };
    const labels = {
      idle: 'Resting', listening: 'Listening', planning: 'Planning',
      working: 'In flight', coordinating: 'Coordinating', verifying: 'Verifying',
      success: 'Delivered', attention: 'Needs you', error: 'Blocked',
      offline: 'Offline', update: 'Update ready',
    };
    [...new Set(Object.values(images))].forEach((source) => {
      const image = new Image();
      image.src = source;
    });
    document.querySelectorAll('.interactive').forEach((target) => {
      let pointerId = null;
      let origin = null;
      let moved = false;
      target.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        pointerId = event.pointerId;
        origin = { x: event.screenX, y: event.screenY };
        moved = false;
        target.setPointerCapture(pointerId);
        api?.beginDrag();
      });
      target.addEventListener('pointermove', (event) => {
        if (pointerId !== null) {
          if (origin && Math.hypot(event.screenX - origin.x, event.screenY - origin.y) > 4) moved = true;
          api?.dragToPointer();
        }
      });
      const finishDrag = (event) => {
        if (pointerId === null || event.pointerId !== pointerId) return;
        if (target.hasPointerCapture(pointerId)) target.releasePointerCapture(pointerId);
        pointerId = null;
        api?.endDrag();
        if (!moved) api?.openTask();
      };
      target.addEventListener('pointerup', finishDrag);
      target.addEventListener('pointercancel', finishDrag);
    });
    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      api?.showMenu();
    });
    api?.onState((snapshot) => {
      const state = images[snapshot?.state] ? snapshot.state : 'idle';
      root.className = `companion ${state}${snapshot?.reducedMotion ? ' reduced-motion' : ''}`;
      const nextImage = images[state];
      if (dragon.getAttribute('src') !== nextImage) {
        dragon.src = nextImage;
        dragon.classList.remove('arriving');
        void dragon.offsetWidth;
        if (!snapshot?.reducedMotion) dragon.classList.add('arriving');
      }
      title.textContent = snapshot?.title || 'Founder is ready';
      detail.textContent = snapshot?.detail || 'Watching this workspace.';
      stateLabel.textContent = labels[state] || 'Ready';
      bubble.classList.toggle('visible', state !== 'idle');
      document.body.setAttribute('aria-label', `${title.textContent}. ${detail.textContent}`);
    });
    api?.ready();
  </script>
</body>
</html>
