[build]
builder = "NIXPACKS"
watchPatterns = [
  "services/btc-conservative-agent/**",
]

[deploy]
startCommand = "python btc_conservative_agent.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
# Retired target. The wrapper also refuses any runtime without FLY_APP_NAME.
# NEVER prevents an accidentally retained Railway service from restart-looping.
restartPolicyType = "NEVER"
