# Fly.io app config for the doxxedcrypto.digital showcase BTC bot.
# App + machine are created by the user (see docs/fly-migration-guide.md).
# DO NOT run `fly deploy` until secrets + volume are set — see the guide.

app = "doxed-btc-bot"
primary_region = "sin"   # Singapore — Bitfinex low latency + avoids congested syd host (mem_overcommit)

# Trading bot must stay up 24/7 — never auto-stop.
[http_service]
  internal_port = 7002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = 512        # Trading-only (no analyzer on Fly) but the bot still imports
                      # pandas+numpy+ccxt+flask (~300MB resident) -> 256MB OOM-killed it.
                      # If you enable ANALYZER_ENABLED=true, bump to 1024.

# Persistent volume for research/ + runtime JSON/JSONL/CSV.
# Created once: `fly volumes create bot_data --region syd --size 1`
[mounts]
  source = "bot_data"
  destination = "/app/data"
