# Fly.io app config for the doxxedcrypto.digital showcase BTC bot.
# App + machine are created by the user (see docs/fly-migration-guide.md).
# DO NOT run `fly deploy` until secrets + volume are set — see the guide.

app = "doxed-btc-bot"
primary_region = "sin"   # Singapore — Bitfinex low latency + avoids congested syd host (mem_overcommit)

[env]
  # Outside durable checkpoint fingerprint (slice/file budget are outside stable identity).
  DATA_SYNC_INVENTORY_SLICE_SECONDS = "60"
  DATA_SYNC_INVENTORY_FILE_BUDGET = "1000"
  # Sealed research segments, shadow mode: write-once store on this volume
  # (/app/data/segment-store), served read-only at /api/research-segments/*.
  # Hard-capped (3 GiB store, 4 GiB free floor); pruning is not enabled.
  RESEARCH_SEGMENTS_ENABLED = "1"
  RESEARCH_SEGMENTS_SINK = "volume"
  RESEARCH_SEGMENTS_ACK_POLL_SECONDS = "300"

# Trading bot must stay up 24/7 — never auto-stop.
[http_service]
  internal_port = 7002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  # Fly routing must test process liveness, not entry eligibility. `/ready`
  # intentionally returns 503 while the Bitfinex trade channel is quiet or
  # any strategy prerequisite is missing; using it here removes the healthy
  # risk manager from public routing and makes both probes appear to hang.
  # `/health` remains fail-closed about trading through its explicit
  # system_ready/trading_ready/live_armed fields.
  path = "/health"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  size = "performance-1x"
                      # One dedicated core. shared-cpu-1x throttles to 6.25% of a core
                      # once burst credits run out, while this same process trades and
                      # serves inventory builds and mirror downloads (hours-long
                      # rebuilds, 503s, maintenance-boundary timeouts).
  memory = 4096       # Trading-only (no analyzer on Fly) but the bot still imports
                      # pandas+numpy+ccxt+flask (~300MB resident) AND accumulates
                      # trade/signal state in memory. 256MB OOM-killed immediately;
                      # 512MB died after ~17min; 2048MB OOM-looped at boot 2026-09-29.

# Persistent volume for research/ + runtime JSON/JSONL/CSV.
# Created once in the app's primary region:
# `fly volumes create bot_data --region sin --size 1`
[mounts]
  source = "bot_data"
  destination = "/app/data"
