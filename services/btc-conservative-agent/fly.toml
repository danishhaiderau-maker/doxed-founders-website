# Fly.io app config for the doxxedcrypto.digital showcase BTC bot.
# App + machine are created by the user (see docs/fly-migration-guide.md).
# DO NOT run `fly deploy` until secrets + volume are set — see the guide.

app = "doxed-btc-bot"
primary_region = "sin"   # Singapore — Bitfinex low latency + avoids congested syd host (mem_overcommit)

[env]
  # Outside durable checkpoint fingerprint (slice/file budget are outside stable identity).
  DATA_SYNC_INVENTORY_SLICE_SECONDS = "60"
  DATA_SYNC_INVENTORY_FILE_BUDGET = "1000"
  # Sealed research segments, shadow mode: write-once store on this volume
  # (/app/data/segment-store), served read-only at /api/research-segments/*.
  # Hard-capped (10 GiB store, 4 GiB free floor). Pruning is custody-gated
  # (laptop ACK + per-file hash parity + analyzer-consumed seq + archive
  # snapshot); it starts in dry_run and is switched via the authenticated
  # /api/research-segments/<prefix>/prune-mode route, persisted on the volume.
  RESEARCH_SEGMENTS_PRUNE_ENABLED = "1"
  RESEARCH_SEGMENTS_PRUNE_DEFAULT_MODE = "dry_run"
  RESEARCH_SEGMENTS_ENABLED = "1"
  RESEARCH_SEGMENTS_SINK = "volume"
  RESEARCH_SEGMENTS_ACK_POLL_SECONDS = "300"
  # Backlog mode: above 8 MiB unshipped, ship 64 MiB segments back-to-back at
  # nice 10 instead of SCHED_IDLE (idle class starves on the saturated core).
  RESEARCH_SEGMENTS_BACKLOG_BOOST_BYTES = "8388608"
  RESEARCH_SEGMENTS_BOOST_SEGMENT_BYTES = "67108864"
  RESEARCH_SEGMENTS_BOOST_NICE = "10"
  # Clean data epoch (post-freeze): every record written by this release carries
  # data_epoch_id; data_epoch.json at the runtime root fixes the start (kept
  # across restarts). Pre-epoch data is wiped only after the 2 h certification
  # gate (diagnostics/CLEAN-EPOCH-RUNBOOK-20261003.md).
  DATA_EPOCH_ID = "ce-20261004-v31-final-c"
  # v3 begins at a genesis BASELINE segment, so only clean-epoch bytes ship.
  RESEARCH_SEGMENTS_PREFIX = "v3"
  RESEARCH_SEGMENTS_STATE_DIR = "/app/data/segment-shipper-v3"
  # research.db grows ~90 MB/day (424.6 MB on 2026-10-02) and would cross the
  # 512 MiB default, turning into a permanent FLY_OVERSIZED_PATHS promotion deny.
  # The online backup restarts on every bot write, so its copy window must also
  # grow with the file; each step still holds the shared lock for one step only.
  RESEARCH_SEGMENTS_MAX_SQLITE_BYTES = "1610612736"
  RESEARCH_SEGMENTS_SQLITE_BACKUP_DEADLINE_SECONDS = "600"
  RESEARCH_SEGMENTS_BASELINE_GENESIS = "1"
  # v1/v2 stay readable/ACKable (no shipper writes them) until the laptop holds
  # every seq; only then may clean-epoch-wipe remove them.
  RESEARCH_SEGMENTS_ARCHIVE_PREFIXES = "v1=/app/data/segment-shipper,v2=/app/data/segment-shipper-v2"

# Trading bot must stay up 24/7 — never auto-stop.
[http_service]
  internal_port = 7002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  # Fly routing must test process liveness, not entry eligibility. `/ready`
  # intentionally returns 503 while the Bitfinex trade channel is quiet or
  # any strategy prerequisite is missing; using it here removes the healthy
  # risk manager from public routing and makes both probes appear to hang.
  # `/health` remains fail-closed about trading through its explicit
  # system_ready/trading_ready/live_armed fields.
  path = "/health"

[[restart]]
  policy = "always"
  processes = ["app"]

[[vm]]
  size = "performance-1x"
                      # One dedicated core. shared-cpu-1x throttles to 6.25% of a core
                      # once burst credits run out, while this same process trades and
                      # serves inventory builds and mirror downloads (hours-long
                      # rebuilds, 503s, maintenance-boundary timeouts).
  memory = 4096       # Trading-only (no analyzer on Fly) but the bot still imports
                      # pandas+numpy+ccxt+flask (~300MB resident) AND accumulates
                      # trade/signal state in memory. 256MB OOM-killed immediately;
                      # 512MB died after ~17min; 2048MB OOM-looped at boot 2026-09-29.

# Persistent volume for research/ + runtime JSON/JSONL/CSV.
# Created once in the app's primary region:
# `fly volumes create bot_data --region sin --size 1`
[mounts]
  source = "bot_data"
  destination = "/app/data"
