[build]
# Use the Dockerfile (root /Dockerfile) for reproducible API-only images.
# The Dockerfile handles workspace pruning, cross-platform lock drift (npm ci
# fails on Linux when the lockfile was generated on Windows), OpenSSL for
# Prisma, and the manifest-before-install ordering that npm workspaces needs.
builder = "DOCKERFILE"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "prisma/**",
  "scripts/start-api-prod.mjs",
  "Dockerfile",
  "railway.toml",
  "tsconfig.base.json",
  "package.json",
  "package-lock.json",
]

[deploy]
# Do NOT prefix env vars here — Dockerfile deploys treat "NODE_ENV=..." as the executable.
# Set NODE_ENV and PRISMA_DB_PUSH in Railway Variables (see docs/railway-deploy.md).
startCommand = "node scripts/start-api-prod.mjs"
healthcheckPath = "/api/health/live"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
numReplicas = 1
# Redeploy trigger: 2026-06-19 — recover API after billing/502 outage
