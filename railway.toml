[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run build:utils && npx prisma generate --schema=prisma/schema.prisma && npm run build --workspace=@dcf/api"
watchPatterns = [
  "apps/api/**",
  "packages/**",
  "prisma/**",
  "scripts/start-api-prod.mjs",
  "railway.toml",
  "package.json",
  "package-lock.json",
]

[deploy]
# Do NOT prefix env vars here — Dockerfile deploys treat "NODE_ENV=..." as the executable.
# Set NODE_ENV and PRISMA_DB_PUSH in Railway Variables (see docs/railway-deploy.md).
startCommand = "node scripts/start-api-prod.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
numReplicas = 1
# Redeploy trigger: 2026-05-31 — fixed startCommand (no inline NODE_ENV)
