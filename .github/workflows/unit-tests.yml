name: unit-tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # 90m: #954 tip after master merge (#955 allowlisted Fix A) exceeded the prior 60m
    # hard cancel (OBSERVED run 41158249581 @1606aeecff43). Prior green heads were ~56–57m.
    # Card seal 9153bcb8f78e companion: allowlisted pytest step must alert (or split the job) at
    # ~75% of this timeout (~67.5 min). Soft-ignoring >75% growth is forbidden.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: "Install API dependencies (for the #842 API specs below)"
        working-directory: .
        run: |
          npm ci
          npx prisma@6.8.2 generate --schema prisma/schema.prisma
          npm run build:utils
      - name: "Run the #842 API specs (Bitfinex ledger layout, exit post-close reconcile, RK1 exit stamps)"
        # bitfinex-api.client.spec.ts imports bitfinex-ledger-layout.spec.ts; the helpers spec imports
        # exit-post-close-reconcile.spec.ts and rk1-live-exit-stamps.spec.ts.
        working-directory: apps/api
        run: |
          npx tsx --test src/exchanges/bitfinex-api.client.spec.ts src/trading-agents/signal-subscriber-execution.helpers.spec.ts
      - name: "Run the #852 two-tile live-gate API specs (HM R4 N7, HM R5 C1, HM R6)"
        working-directory: apps/api
        run: |
          npx tsx --test \
            src/trading-agents/live-guardian-force-flat.spec.ts \
            src/trading-agents/btc10-ops-railway-admin.spec.ts \
            src/trading-agents/shared-read-budget.spec.ts \
            src/trading-agents/live-mutex-concurrency.spec.ts \
            src/trading-agents/live-row-countability.spec.ts \
            src/trading-agents/stop-evidence-cadence.spec.ts \
            src/trading-agents/live-copy-fly-reporter.spec.ts \
            src/trading-agents/exit-post-close-reconcile.spec.ts \
            src/trading-agents/live-exit-fill-evidence.spec.ts \
            src/trading-agents/live-boot-reconcile.spec.ts \
            src/trading-agents/live-exit-fill-c1.spec.ts \
            src/trading-agents/live-report-contract.spec.ts \
            src/trading-agents/live-exit-b2.spec.ts \
            src/trading-agents/live-boot-nit5.spec.ts \
            src/trading-agents/live-hm-r6-nits.spec.ts \
            src/trading-agents/live-arm-l27-gate.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime requirements
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest
      - name: Tile registry audit (ACTIVE_RETIRED_OVERLAP and every other registry defect)
        # HM 20261023-tile67-removal C2: run combo_pathway_config.validate_tile_registry() in CI so an
        # active/retired overlap (e.g. a DISLOC lane re-added to ACTIVE_TILE_ORDER) fails the PR.
        run: |
          python - <<'PY'
          import combo_pathway_config as c
          defects = c.validate_tile_registry()
          print({"active": list(c.ACTIVE_TILE_ORDER), "retired_count": len(c.RETIRED_TILE_LANES), "defects": list(defects)})
          if defects:
              raise SystemExit("tile registry defects: " + "; ".join(defects))
          PY
      - name: R3 market_segment guards (RK #873) - 0 live reads, scoped strict xfail, shrink-only list
        # Fails the PR if a live market_segment read is reintroduced, if the legacy xfail list grows
        # (vs the base branch, and vs the CEILING constant), lists a forbidden-category test, or if the
        # xfail plugin stops being strict/scoped.
        run: |
          base="${GITHUB_BASE_REF:-master}"
          if git fetch --depth=1 origin "$base" 2>/dev/null && \
             git show "FETCH_HEAD:services/btc-conservative-agent/ci/r3_legacy_segment_tests.txt" > /tmp/r3_base_list.txt 2>/dev/null; then
            export R3_BASE_LIST=/tmp/r3_base_list.txt
            echo "base list: $(grep -vc '^#' /tmp/r3_base_list.txt) entries"
          fi
          python -m pytest -q -p no:cacheprovider \
            test_market_segment_r3_consumers.py::test_zero_live_market_segment_reads \
            test_r3_legacy_xfail_scope.py
      - name: Run the allowlisted test files (ci/unit_test_allowlist.txt)
        # Allowlist of files that pass under pytest; KNOWN_RED files are listed with owner and date in
        # ci/known_red.txt, and test_ci_test_inventory.py fails when a test file is in neither list.
        # Card seal 9153bcb8f78e (C3): if this step wall-time exceeds ~75% of jobs.unit-tests
        # timeout-minutes (0.75 × 90 ≈ 67.5 min), emit a CI ::warning with measured minutes (alert
        # path chosen). Alternate split plan (not executed here): move API tsx specs and/or
        # script-style runners and/or an allowlist shard into a parallel job so pytest stays under
        # the 75% threshold. Soft-ignoring >75% growth is forbidden (R26/R36).
        run: |
          deselect=""
          while IFS='|' read -r node _; do
            node="$(echo "$node" | xargs)"
            case "$node" in ""|\#*) continue;; esac
            deselect="$deselect --deselect $node"
          done < ci/known_red_tests.txt
          files="$(grep -v '^#' ci/unit_test_allowlist.txt | grep -v '^$' | tr '\n' ' ')"
          # --rootdir . pins node ids to this service dir. Without it the ../../scripts/ entries move the
          # rootdir to the repo root, the known_red_tests.txt node ids stop matching and nothing is deselected.
          start_ts=$(date +%s)
          set +e
          python -m pytest $files $deselect --rootdir . -q -p no:cacheprovider
          rc=$?
          set -e
          end_ts=$(date +%s)
          elapsed_sec=$((end_ts - start_ts))
          # 0.75 × 90 min = 67.5 min = 4050 s (card seal 9153bcb8f78e)
          threshold_sec=4050
          elapsed_min=$(awk -v s="$elapsed_sec" 'BEGIN { printf "%.1f", s / 60 }')
          echo "allowlisted pytest wall: ${elapsed_min} min (75% alert threshold 67.5 min @ 90m job timeout)"
          if [ "$elapsed_sec" -ge "$threshold_sec" ]; then
            echo "::warning title=unit-tests pytest headroom::Allowlisted pytest step took ${elapsed_min} min (>= 75% of 90m job timeout ≈ 67.5 min). Split plan if growth continues: move API tsx specs and/or script-style runners and/or an allowlist shard into a parallel job. Card seal 9153bcb8f78e."
          fi
          exit $rc
      - name: Run script-style safety and contract files as `python file` (ci/script_style_tests.txt)
        # These files have no pytest collection (module-level checks / __main__), so pytest never runs them.
        # Each must exit 0; a failure here is a real red. The deploy job runs some of them the same way.
        run: |
          rc=0
          while read -r f; do
            case "$f" in ""|\#*) continue;; esac
            echo "::group::python $f"
            python "$f" || { echo "::error::$f failed"; rc=1; }
            echo "::endgroup::"
          done < ci/script_style_tests.txt
          exit $rc

  # Fly deploy run 40063653539 (24 Oct 2026) failed at image build: .dockerignore dropped research/r3_quarantine.py,
  # which the analyzer imports. Build the real docker context (same Dockerfile dir, same .dockerignore) and require
  # every module bot.py and each fly-entrypoint.sh process import-reach to be in it and importable there.
  bot-image-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot runtime requirements (same file the Dockerfile installs)
        run: pip install --no-cache-dir -r requirements.txt
      - name: Export the exact Fly image build context (docker applies the real .dockerignore)
        run: |
          printf 'FROM scratch\nCOPY . /\n' | DOCKER_BUILDKIT=1 docker build -f - --output type=local,dest=/tmp/bot-image-ctx .
          test -f /tmp/bot-image-ctx/bot.py
          echo "context files: $(find /tmp/bot-image-ctx -type f | wc -l)"
      - name: Every module bot.py (and each entrypoint process) imports is in the image context and imports
        run: python ci_image_import_check.py --src . --ctx /tmp/bot-image-ctx
