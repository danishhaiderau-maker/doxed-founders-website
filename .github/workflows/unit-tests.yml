name: unit-tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: "Install API dependencies (for the #842 API specs below)"
        working-directory: .
        run: |
          npm ci
          npx prisma@6.8.2 generate --schema prisma/schema.prisma
          npm run build:utils
      - name: "Run the #842 API specs (Bitfinex ledger layout, exit post-close reconcile, RK1 exit stamps)"
        # bitfinex-api.client.spec.ts imports bitfinex-ledger-layout.spec.ts; the helpers spec imports
        # exit-post-close-reconcile.spec.ts and rk1-live-exit-stamps.spec.ts.
        working-directory: apps/api
        run: |
          npx tsx --test src/exchanges/bitfinex-api.client.spec.ts src/trading-agents/signal-subscriber-execution.helpers.spec.ts
      - name: "Run the #852 two-tile live-gate API specs (HM R4 N7, HM R5 C1)"
        working-directory: apps/api
        run: |
          npx tsx --test \
            src/trading-agents/live-guardian-force-flat.spec.ts \
            src/trading-agents/shared-read-budget.spec.ts \
            src/trading-agents/live-mutex-concurrency.spec.ts \
            src/trading-agents/live-row-countability.spec.ts \
            src/trading-agents/stop-evidence-cadence.spec.ts \
            src/trading-agents/live-copy-fly-reporter.spec.ts \
            src/trading-agents/exit-post-close-reconcile.spec.ts \
            src/trading-agents/live-exit-fill-evidence.spec.ts \
            src/trading-agents/live-boot-reconcile.spec.ts \
            src/trading-agents/live-exit-fill-c1.spec.ts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python runtime requirements
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest
      - name: Tile registry audit (ACTIVE_RETIRED_OVERLAP and every other registry defect)
        # HM 20261023-tile67-removal C2: run combo_pathway_config.validate_tile_registry() in CI so an
        # active/retired overlap (e.g. a DISLOC lane re-added to ACTIVE_TILE_ORDER) fails the PR.
        run: |
          python - <<'PY'
          import combo_pathway_config as c
          defects = c.validate_tile_registry()
          print({"active": list(c.ACTIVE_TILE_ORDER), "retired_count": len(c.RETIRED_TILE_LANES), "defects": list(defects)})
          if defects:
              raise SystemExit("tile registry defects: " + "; ".join(defects))
          PY
      - name: Run the allowlisted test files (ci/unit_test_allowlist.txt)
        # Allowlist of files that pass under pytest; KNOWN_RED files are listed with owner and date in
        # ci/known_red.txt, and test_ci_test_inventory.py fails when a test file is in neither list.
        run: |
          deselect=""
          while IFS='|' read -r node _; do
            node="$(echo "$node" | xargs)"
            case "$node" in ""|\#*) continue;; esac
            deselect="$deselect --deselect $node"
          done < ci/known_red_tests.txt
          files="$(grep -v '^#' ci/unit_test_allowlist.txt | grep -v '^$' | tr '\n' ' ')"
          python -m pytest $files $deselect -q -p no:cacheprovider
      - name: Run script-style safety and contract files as `python file` (ci/script_style_tests.txt)
        # These files have no pytest collection (module-level checks / __main__), so pytest never runs them.
        # Each must exit 0; a failure here is a real red. The deploy job runs some of them the same way.
        run: |
          rc=0
          while read -r f; do
            case "$f" in ""|\#*) continue;; esac
            echo "::group::python $f"
            python "$f" || { echo "::error::$f failed"; rc=1; }
            echo "::endgroup::"
          done < ci/script_style_tests.txt
          exit $rc
