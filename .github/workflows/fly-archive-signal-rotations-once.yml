name: Fly archive signal rotations once

# Quarantine closed signal_replay.jsonl.N + chase_offset_touch_grid.jsonl.N
# into invent-excluded research_archive/. Never touches unsuffixed writers.
# Never arms Bitfinex. Soft-cap unchanged.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Must be true to move; false = list-only probe
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  archive-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Quarantine closed signal/chase rotations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          mid="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=$mid APPLY=$APPLY"
          # Chunked base64 upload (avoid ARG_MAX / PayloadTooLarge on full embed).
          base64 -w0 diagnostics/fly-archive-signal-rotations.py > /tmp/sig_arch.b64
          wc -c /tmp/sig_arch.b64 diagnostics/fly-archive-signal-rotations.py
          flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
            "sh -lc 'rm -f /tmp/fly-archive-signal-rotations.py /tmp/sig_arch.b64 /tmp/sig_arch_out.json /tmp/sig_arch_rc.txt'"
          split -b 3000 -d /tmp/sig_arch.b64 /tmp/sig_arch_part_
          for part in /tmp/sig_arch_part_*; do
            chunk="$(cat "$part")"
            flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
              "sh -lc 'printf %s ${chunk} >> /tmp/sig_arch.b64'"
          done
          flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
            "sh -lc 'base64 -d /tmp/sig_arch.b64 > /tmp/fly-archive-signal-rotations.py && wc -c /tmp/fly-archive-signal-rotations.py && head -n 2 /tmp/fly-archive-signal-rotations.py'"
          flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
            "sh -lc 'rm -f /tmp/sig_arch_out.json /tmp/sig_arch_rc.txt; setsid nohup sh -c \"APPLY=${APPLY} DATA_ROOT=/app/data PYTHONUNBUFFERED=1 python -u /tmp/fly-archive-signal-rotations.py > /tmp/sig_arch_out.json 2>&1; echo \\$? > /tmp/sig_arch_rc.txt\" </dev/null >/dev/null 2>&1 & echo LAUNCHED=\$!'"
          python - <<'PY'
          import json, subprocess, time, sys
          mid = subprocess.check_output(["flyctl","machines","list","--app","doxed-btc-bot","--json"], text=True)
          rows=json.loads(mid)
          machine=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}][0]["id"]
          deadline=time.time()+600
          body=""
          while time.time()<deadline:
              p=subprocess.run(["flyctl","machine","exec","--app","doxed-btc-bot","--timeout","45",machine,
                "sh -lc 'echo RC=$(cat /tmp/sig_arch_rc.txt 2>/dev/null || echo missing); wc -c /tmp/sig_arch_out.json 2>/dev/null; tail -c 400 /tmp/sig_arch_out.json 2>/dev/null || true'"],
                text=True, capture_output=True)
              body=(p.stdout or "")+(("\n"+p.stderr) if p.stderr else "")
              print(body[-1500:], flush=True)
              if "RC=0" in body or "RC=1" in body:
                  break
              time.sleep(5)
          else:
              raise SystemExit("signal archive timed out")
          p=subprocess.run(["flyctl","machine","exec","--app","doxed-btc-bot","--timeout","60",machine,
            "sh -lc 'python -c \"import json; d=json.load(open(\\\"/tmp/sig_arch_out.json\\\")); print(json.dumps({k:d.get(k) for k in [\\\"ok\\\",\\\"apply\\\",\\\"candidate_count\\\",\\\"eligible_mib\\\",\\\"bytes_moved_mib\\\",\\\"noop_reason\\\",\\\"actives\\\",\\\"archive_root\\\",\\\"error\\\"]}, sort_keys=True))\"'"],
            text=True, capture_output=True)
          summary=(p.stdout or "")+(("\n"+p.stderr) if p.stderr else "")
          print(summary, flush=True)
          try:
              start=summary.find("{"); end=summary.rfind("}")
              obj=json.loads(summary[start:end+1])
          except Exception as exc:
              raise SystemExit(f"summary parse failed: {exc}") from exc
          if obj.get("ok") is not True:
              raise SystemExit("archive not ok")
          if obj.get("apply") and int(obj.get("candidate_count") or 0) == 0:
              print("WARN: apply with zero candidates", flush=True)
          PY
