name: Monitor Fly BTC bot

on:
  schedule:
    # Fly probes /health every 15s and Railway owns the sustained-drop guard.
    # This job is revision-drift and safety observability, not the money-path
    # watchdog. Failures are deduplicated by scripts/fly_monitor_run.py: a run
    # fails only when an incident alerts or re-alerts, and one issue labelled
    # fly-monitor-incident tracks it until recovery.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Inject one synthetic test_alert finding to prove the incident issue opens (two normal runs close it)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: fly-bot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore incident state
        uses: actions/cache/restore@v4
        with:
          path: .fly-monitor-state
          key: fly-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fly-monitor-state-
      - name: Verify Fly liveness, safety, revision, readiness, and strategy progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_MONITOR_STATE: .fly-monitor-state/state.json
          # The deployed paper cohort is explicitly score-led. Keep the
          # monitor's registry identity on the same startup policy as Fly;
          # an unset flag would expect the retired hypothesis identity.
          SCORE_LED_PAPER_RESEARCH_ENABLED: "1"
          # Transfer lag stays an annotation until the Tigris segment pipeline
          # replaces the legacy ACK path; set to "1" to make it page.
          FLY_MONITOR_SEGMENTS_LIVE: "0"
          FLY_MONITOR_TEST_ALERT: ${{ inputs.test_alert && '1' || '0' }}
          # Epoch seconds refreshed every 15 min by scripts/laptop_chain_incident.py
          # from the laptop supervisor; stale > 2h raises laptop_silent.
          LAPTOP_CHAIN_HEARTBEAT: ${{ vars.LAPTOP_CHAIN_HEARTBEAT }}
        run: python scripts/fly_monitor_run.py
      - name: Save incident state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fly-monitor-state
          key: fly-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
