name: Monitor Fly BTC bot

on:
  schedule:
    # Fly probes /health every 15s and Railway owns the sustained-drop guard.
    # This job is revision-drift observability, not the money-path watchdog.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-drift:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the newest commit that could have triggered a Fly deploy.
          # The deploy workflow also runs when its own safety contract or the
          # canonical flat-boundary checker changes, so service-only history
          # would report a false revision drift after those releases.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve expected Fly bot revision
        id: expected
        shell: bash
        run: |
          revision="$(git log -1 --format=%H -- \
            services/btc-conservative-agent \
            scripts/check-relay-flat.mjs \
            .github/workflows/fly-bot-deploy.yml \
            ':(exclude,glob)services/btc-conservative-agent/test*.py')"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve latest btc-conservative-agent revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Verify Fly is alive, safe, and running current bot source
        env:
          EXPECTED_REVISION: ${{ steps.expected.outputs.revision }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          sys.path.insert(0, "services/btc-conservative-agent")
          import combo_pathway_config as registry

          required = os.environ["EXPECTED_REVISION"]
          with urllib.request.urlopen("https://doxed-btc-bot.fly.dev/health", timeout=12) as response:
              liveness = json.load(response)
          if response.status != 200 or liveness.get("process_alive") is not True:
              raise SystemExit(f"Fly process is not alive: {liveness}")
          with urllib.request.urlopen("https://doxed-btc-bot.fly.dev/api/status", timeout=12) as status_response:
              health = json.load(status_response)
          if status_response.status != 200 or health.get("process_alive") is not True:
              raise SystemExit(f"Fly detailed status is unavailable: {health}")
          reported = str(health.get("source_git_rev") or health.get("git_rev") or "")
          if not re.fullmatch(r"[0-9a-f]{7,40}", reported):
              raise SystemExit(f"Fly returned an invalid source revision: {reported}")
          resolved = subprocess.run(
              ["git", "rev-parse", "--verify", f"{reported}^{{commit}}"],
              check=False,
              capture_output=True,
              text=True,
          )
          actual = resolved.stdout.strip()
          if resolved.returncode != 0 or not re.fullmatch(r"[0-9a-f]{40}", actual):
              raise SystemExit(f"Fly returned an invalid source revision: {actual}")
          # A path-filtered push deploys the push HEAD, which may be a metadata
          # descendant of the newest bot-source commit. Exact equality creates
          # false drift alarms. Prove both ancestry directions instead: the
          # deployed revision contains the latest required bot source, and it
          # belongs to the current checked-out master history.
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", required, actual],
              check=False,
          ).returncode != 0:
              raise SystemExit(
                  f"Fly bot source is stale: required ancestor {required[:12]}, got {actual[:12]}"
              )
          if subprocess.run(
              ["git", "merge-base", "--is-ancestor", actual, "HEAD"],
              check=False,
          ).returncode != 0:
              raise SystemExit(
                  f"Fly revision is not on current master: {actual[:12]}"
              )
          if not (
              health.get("force_paper_mode") is True
              and health.get("live_armed") is False
              and health.get("bitfinex_live_enabled") is False
          ):
              raise SystemExit(f"Fly bot execution safety drift: {health}")
          runtime_lanes = [row.get("lane") for row in health.get("active_tiles") or []]
          if (
              health.get("bot_version") != registry.EXECUTION_FIX_VERSION
              or health.get("tile_registry_signature") != registry.active_tile_registry_signature()
              or runtime_lanes != list(registry.ACTIVE_TILE_ORDER)
          ):
              raise SystemExit(
                  "Fly tile registry drift: "
                  f"version={health.get('bot_version')} lanes={runtime_lanes} "
                  f"signature={health.get('tile_registry_signature')}"
              )
          print(
              f"Fly process healthy, disarmed, and current: {actual} "
              f"(contains bot source {required[:12]})"
          )

          with urllib.request.urlopen(
              "https://doxed-btc-bot.fly.dev/ready", timeout=12
          ) as response:
              ready = json.load(response)
          if response.status != 200 or ready.get("ok") is not True:
              raise SystemExit(f"Strict readiness failed: {ready}")
          if ready.get("tile_registry_signature") != registry.active_tile_registry_signature():
              raise SystemExit(f"Ready tile registry drift: {ready}")
          print(f"Strict readiness sample: {json.dumps(ready, sort_keys=True)}")
          PY
  strategy-progress:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Verify strategy progress independently of process liveness
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen(
              "https://doxed-btc-bot.fly.dev/api/status", timeout=12
          ) as response:
              health = json.load(response)
          progress = health.get("strategy_progress") or {}
          incident = health.get("strategy_progress_incident") or {}
          diagnostics = {
              "process_alive": health.get("process_alive"),
              "revision": health.get("source_git_rev") or health.get("git_rev"),
              "strategy_progress": progress,
              "strategy_progress_incident": incident,
              "market_data_mode": health.get("market_data_mode"),
              "paper_only": health.get("force_paper_mode"),
              "live_armed": health.get("live_armed"),
          }
          print(json.dumps(diagnostics, indent=2, sort_keys=True))
          if response.status != 200 or health.get("process_alive") is not True:
              raise SystemExit("Fly process liveness failed")
          if progress.get("ok") is not True:
              reasons = progress.get("reasons") or ["UNKNOWN_PROGRESS_FAILURE"]
              raise SystemExit(
                  "Fly strategy progress stalled: "
                  f"reasons={reasons} ws_age={progress.get('ws_age_sec')} "
                  f"ai_age={progress.get('ai_age_sec')} "
                  f"trade_lock_available={progress.get('trade_lock_available')} "
                  f"positions={progress.get('open_positions')} "
                  f"pending={progress.get('pending_orders')}"
              )
          PY
