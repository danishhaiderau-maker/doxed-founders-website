name: Monitor Fly BTC bot
# RETIRED / DISABLED IN PLACE — do NOT delete this file (RK PASS 01:21 AEDT: disable-not-delete).
# Fly app doxed-btc-bot DELETED 2026-11-03 01:12 AEDT (OBSERVED). Cite R22 + R50(e)/R50c.
# No push auto-deploy, no schedule probes, every job hard-gated with `if: false`.
# Manual workflow_dispatch retained only so the file stays a valid Actions workflow; jobs never run.

on:
  # FORMER cron */15 REMOVED — no Fly /health probes (app deleted).
  workflow_dispatch:
    inputs:
      test_alert:
        description: Inject one synthetic test_alert finding to prove the incident issue opens (two normal runs close it)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: fly-bot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: false  # FLY_RUNTIME_RETIRED — hard fail-closed
    runs-on: ubuntu-slim
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore incident state
        uses: actions/cache/restore@v4
        with:
          path: .fly-monitor-state
          key: fly-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fly-monitor-state-
      - name: Verify Fly liveness, safety, revision, readiness, and strategy progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLY_MONITOR_STATE: .fly-monitor-state/state.json
          # The deployed paper cohort is explicitly score-led. Keep the
          # monitor's registry identity on the same startup policy as Fly;
          # an unset flag would expect the retired hypothesis identity.
          SCORE_LED_PAPER_RESEARCH_ENABLED: "1"
          # Transfer lag stays an annotation until the Tigris segment pipeline
          # replaces the legacy ACK path; set to "1" to make it page.
          FLY_MONITOR_SEGMENTS_LIVE: "0"
          FLY_MONITOR_TEST_ALERT: ${{ inputs.test_alert && '1' || '0' }}
          # Epoch seconds refreshed every 15 min by scripts/laptop_chain_incident.py
          # from the laptop supervisor; stale > 2h raises laptop_silent.
          LAPTOP_CHAIN_HEARTBEAT: ${{ vars.LAPTOP_CHAIN_HEARTBEAT }}
          # Previous run's dead-man heartbeat (JSON {at, run_id, ...}); a gap
          # > 45 min raises monitor_schedule_gap. Gap detection also uses the
          # cached state and this workflow's runs list (actions: read).
          FLY_MONITOR_HEARTBEAT: ${{ vars.FLY_MONITOR_HEARTBEAT }}
          # GITHUB_TOKEN cannot write Actions variables. Optional fine-grained
          # PAT scoped to this repo with "Variables: read and write" only;
          # when unset the heartbeat write is skipped with a notice.
          FLY_MONITOR_VARIABLES_TOKEN: ${{ secrets.FLY_MONITOR_VARIABLES_TOKEN }}
        run: python scripts/fly_monitor_run.py
      - name: Save incident state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fly-monitor-state
          key: fly-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
