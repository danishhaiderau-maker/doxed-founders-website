name: Deploy Fly BTC bot

on:
  push:
    branches: [master]
    paths:
      - "services/btc-conservative-agent/**"
      # Tests validate an image but are not copied into or imported by the
      # running Fly service. A test-only push must not claim a new deployed
      # source revision.
      - "!services/btc-conservative-agent/test*.py"
      # The isolated inventory worker is part of the deployed runtime, and its
      # focused containment/nonce suite is an explicit deployment gate.
      - "services/btc-conservative-agent/data_sync_inventory_worker.py"
      - "services/btc-conservative-agent/test_data_sync_inventory_worker_contract.py"
      - "services/btc-conservative-agent/test_data_sync_cadence_throttle_contract.py"
      - "services/btc-signal-engine/data_sync_inventory_worker.py"
      - "scripts/check-relay-flat.mjs"
      - ".github/workflows/fly-bot-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy normally or restart the existing Fly machine without changing its image
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - recover-unready
          - recover-stalled-runtime
          - restart-only
          - inspect-runtime
          - close-paper-position
          - flatten-paper-exposure
      expected_unready_revision:
        description: Exact 12-character Fly revision permitted for recover-unready
        required: false
        type: string
      recovery_failed_run_id:
        description: Failed deploy run that proves the exact unready revision reached Fly
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fly-btc-production
  cancel-in-progress: false

jobs:
  close-paper-position:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'close-paper-position'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close one explicitly authorized paper position through normal accounting
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          PAPER_TRADE_ID: ${{ inputs.expected_unready_revision }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          trade_id = str(os.environ.get("PAPER_TRADE_ID") or "").strip()
          if not re.fullmatch(r"[A-Za-z0-9_-]{6,96}", trade_id):
              raise SystemExit("close-paper-position requires one exact paper trade id")
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          if not token:
              raise SystemExit("BOT_ADMIN_TOKEN is missing")
          with urllib.request.urlopen(base + "/health", timeout=10) as response:
              health = json.load(response)
          if not (
              health.get("force_paper_mode") is True
              and health.get("bitfinex_live_enabled") is False
              and health.get("live_armed") is False
          ):
              raise SystemExit("refusing paper close because live-safety flags are not proven")
          request = urllib.request.Request(
              base + "/api/positions/close",
              data=json.dumps({"trade_id": trade_id}).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-Bot-Admin-Token": token,
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.load(response)
          if result.get("status") != "closed" or result.get("trade_id") != trade_id:
              raise SystemExit("paper close did not return its exact accounting receipt")
          print(json.dumps({"status": "closed", "trade_id": trade_id, "scope": result.get("scope")}, sort_keys=True))
          PY

  flatten-paper-exposure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'flatten-paper-exposure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Flatten exact paper-only exposure through authenticated accounting
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          base = "https://doxed-btc-bot.fly.dev"
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          if not token:
              raise SystemExit("BOT_ADMIN_TOKEN is missing")

          def request_json(path, payload=None, timeout=45):
              headers = {"X-Bot-Admin-Token": token, "Cache-Control": "no-cache"}
              data = None
              method = "GET"
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
                  method = "POST"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)

          def execution_state():
              last = None
              for attempt in range(1, 6):
                  try:
                      state = request_json("/api/relay-execution-state?fresh=1", timeout=20)
                      if not isinstance(state.get("orders"), list) or not isinstance(state.get("positions"), list):
                          raise RuntimeError("authenticated execution state omitted exposure arrays")
                      return state
                  except Exception as exc:
                      last = exc
                      time.sleep(min(2 * attempt, 8))
              raise RuntimeError(f"execution state unavailable: {type(last).__name__}")

          health = request_json("/health", timeout=20)
          if not (
              health.get("force_paper_mode") is True
              and health.get("live_armed") is False
              and health.get("bitfinex_live_enabled") is False
          ):
              raise SystemExit("paper/live safety flags are not proven")

          actions = []
          for round_no in range(1, 4):
              state = execution_state()
              positions = sorted({str(row.get("trade_id") or "").strip() for row in state["positions"]} - {""})
              orders = sorted({str(row.get("trade_id") or "").strip() for row in state["orders"]} - {""})
              if not positions and not orders:
                  print(json.dumps({"status": "flat", "round": round_no, "actions": actions}, sort_keys=True))
                  raise SystemExit(0)
              for trade_id in positions:
                  try:
                      result = request_json(
                          "/api/reconcile/phantom-cancel",
                          {"trade_id": trade_id, "reason": "AUTHORIZED_PAPER_UPGRADE_BOUNDARY_UNKNOWN"},
                      )
                      actions.append({"kind": "position", "trade_id": trade_id, "ok": result.get("ok") is True})
                  except Exception as exc:
                      actions.append({"kind": "position", "trade_id": trade_id, "error": type(exc).__name__})
              for trade_id in orders:
                  try:
                      result = request_json("/api/orders/cancel", {"trade_id": trade_id})
                      actions.append({"kind": "order", "trade_id": trade_id, "ok": result.get("status") == "cancelled"})
                  except Exception as exc:
                      actions.append({"kind": "order", "trade_id": trade_id, "error": type(exc).__name__})
              time.sleep(3)
          final = execution_state()
          remaining_positions = [row.get("trade_id") for row in final["positions"]]
          remaining_orders = [row.get("trade_id") for row in final["orders"]]
          raise SystemExit(
              "paper exposure did not flatten: "
              + json.dumps({"positions": remaining_positions, "orders": remaining_orders, "actions": actions}, sort_keys=True)
          )
          PY

  inspect-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capture current machine status and recent logs without mutation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          run_probe() {
            label="$1"
            shift
            echo "===${label}==="
            if timeout --signal=TERM --kill-after=5s 45s "$@"; then
              return 0
            else
              code="$?"
            fi
            echo "::warning title=Fly read-only probe incomplete::${label} exited ${code}; continuing with the remaining bounded probes"
            return 0
          }
          run_probe FLY_STATUS flyctl status --app doxed-btc-bot
          machine_json="$(timeout --signal=TERM --kill-after=5s 30s flyctl machines list --app doxed-btc-bot --json)"
          machine_id="$(printf '%s' "$machine_json" | python -c 'import json,sys; rows=json.load(sys.stdin); active=[row for row in rows if str(row.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active) == 1, f"expected exactly one active machine, found {len(active)}"; print(active[0]["id"])')"
          run_probe MACHINE_STATUS flyctl machine status --app doxed-btc-bot "$machine_id"
          run_probe RECENT_PLATFORM_LOGS flyctl logs --app doxed-btc-bot --no-tail
          # Machine Exec uses the Fly Machines guest-agent path rather than
          # the application's Flask worker or SSH service.  Keep this probe
          # read-only and emit only bounded lifecycle identity/count fields so
          # a wedged owner can still prove whether its last atomic paper
          # snapshot contains exposure without disclosing order payloads.
          run_probe DURABLE_PAPER_LIFECYCLE flyctl machine exec --app doxed-btc-bot --timeout 30 "$machine_id" \
            "python -c 'from pathlib import Path; import json,os; p=Path(\"/app/data/runtime/paper_lifecycle_v1.json\"); d=json.loads(p.read_text(encoding=\"utf-8\")); assert d.get(\"schema\")==\"paper_lifecycle_v1\"; assert d.get(\"paper_only\") is True and d.get(\"live_armed\") is False; positions=d.get(\"positions\"); orders=d.get(\"pending_orders\"); assert isinstance(positions,list) and isinstance(orders,list); assert len(positions)<=100000 and len(orders)<=100000; assert all(isinstance(x,dict) and str(x.get(\"trade_id\") or \"\").strip() and str(x.get(\"status\") or \"\").upper()==\"OPEN\" for x in positions); assert all(isinstance(x,dict) and str(x.get(\"trade_id\") or \"\").strip() and str(x.get(\"status\") or \"\").upper()==\"PENDING\" for x in orders); pids=sorted(str(x[\"trade_id\"]) for x in positions); oids=sorted(str(x[\"trade_id\"]) for x in orders); print(json.dumps({\"schema\":d.get(\"schema\"),\"saved_at\":d.get(\"saved_at\"),\"file_mtime_epoch\":p.stat().st_mtime,\"snapshot_git_rev\":d.get(\"git_rev\"),\"runtime_source_git_rev\":os.getenv(\"SOURCE_GIT_REV\"),\"paper_only\":d.get(\"paper_only\"),\"live_armed\":d.get(\"live_armed\"),\"open_position_count\":len(positions),\"open_position_id_sample\":pids[:20],\"open_position_ids_truncated\":len(pids)>20,\"pending_order_count\":len(orders),\"pending_order_id_sample\":oids[:20],\"pending_order_ids_truncated\":len(oids)>20},sort_keys=True))'"
          run_probe PROCESS_AND_BOT_LOG flyctl ssh console --app doxed-btc-bot --machine "$machine_id" --command \
            "sh -lc 'echo ===PROCESS_MEMORY===; ps -eo pid,ppid,rss,vsz,etime,comm,args --sort=-rss | head -n 20; echo ===RECENT_BOT_LOG===; tail -n 2500 /app/data/bot.log'"
          run_probe RELAY_STREAM_VALIDATION flyctl ssh console --app doxed-btc-bot --machine "$machine_id" --command \
            "python -c 'from pathlib import Path; import json,resource,time; from platform_relay_streaming import validate_streaming; p=Path(\"/app/data/relay_lifecycle_evidence_v1.json\"); t=time.perf_counter(); r=validate_streaming(p); print(json.dumps({\"stage\":\"direct_stream_validation\",\"valid\":r[0],\"code\":r[1],\"records\":r[2].get(\"records\"),\"bytes\":p.stat().st_size,\"seconds\":round(time.perf_counter()-t,3),\"maxrss_kib\":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}))'"
          run_probe INCIDENT_LOG_SCAN flyctl ssh console --app doxed-btc-bot --machine "$machine_id" --command \
            "grep -nE 'fly-entrypoint.*bot (starting|exited)|WATCHDOG.*(failed|exiting|stale)|Traceback|MemoryError|Killed|Out of memory' /app/data/bot.log"
          # The line-number scan proves an incident exists but a bare
          # `Traceback` marker cannot identify the failing thread.  Emit only
          # bounded context around the newest traceback so diagnosis remains
          # useful without downloading or disclosing the complete bot log.
          run_probe LATEST_TRACEBACK_CONTEXT flyctl ssh console --app doxed-btc-bot --machine "$machine_id" --command \
            "sh -lc 'grep -n -B 8 -A 48 \"Traceback (most recent call last):\" /app/data/bot.log | tail -n 120'"

  restart-only:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'restart-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Restart the existing wedged Fly machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[row for row in rows if str(row.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active) == 1, f"expected exactly one active machine, found {len(active)}"; print(active[0]["id"])')"
          flyctl machines restart --app doxed-btc-bot "$machine_id"

  test-and-deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy' || inputs.mode == 'recover-unready' || inputs.mode == 'recover-stalled-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python runtime requirements
        # fly_relay_state_pusher.py imports `requests` at module load, and several
        # safety-contract tests exercise it. Mirror the Dockerfile by installing
        # requirements.txt so the contract checks run against the real runtime.
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest

      - name: Verify Fly and dashboard safety contracts
        run: |
          python -m py_compile bot.py data_sync_inventory_worker.py btc_conservative_agent.py fly_relay_state_pusher.py platform_relay_evidence_worker.py platform_relay_streaming.py
          python -m pytest test_platform_relay_evidence_worker.py -q
          python -m pytest test_data_sync_inventory_worker_contract.py -q
          python -m pytest test_data_sync_cadence_throttle_contract.py -q
          python test_fly_startup_contract.py
          python test_paper_skips_risk_pauses.py
          python test_daily_pnl_utc_rollover.py
          python test_research_warehouse_export_mode.py
          python test_research_export_csv.py
          python test_fly_single_owner_contract.py
          python test_fly_data_sync_contract.py
          python test_fly_relay_state_pusher_contract.py
          python test_ws_live_readiness_contract.py
          python -m pytest test_order_multiverse.py test_chase_offset_touch_grid.py -q
          python -m pytest test_continuous_r2_floor.py -q
          python -m pytest test_chase_exact_bucket_controls.py -q
          python -m pytest test_paper_natural_cycle_exits.py test_epoch_quarantine.py -q
          python test_manual_pause_entry_gate.py
          python test_paper_mode_private_api_isolation.py
          python test_platform_relay_lane_isolation.py
          python test_showcase_manual_close.py
          python test_tile_summary_settings_periods.py
          python -m pytest test_tile_registry_contract.py test_active_execution_graph_contract.py -q
          python -m pytest test_collector_v22_integrity.py test_compressed_shadow_chase.py test_paper_lifecycle_restart.py test_cleanup_characterization_contract.py test_v3_lane_entry_bot_wiring.py -q
          python -m pytest test_v31_overview_best_policy_counts.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify canonical signal-engine parity
        working-directory: ${{ github.workspace }}
        run: node scripts/verify-signal-parity.mjs --full

      - name: Install production boundary checker
        working-directory: ${{ github.workspace }}
        run: |
          npm ci
          npx prisma generate

      - name: Enter durable authenticated paper maintenance boundary
        working-directory: ${{ github.workspace }}
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          if not token:
              raise SystemExit("BOT_ADMIN_TOKEN is missing")
          headers = {"X-Bot-Admin-Token": token, "Cache-Control": "no-cache"}
          legacy_bootstrap_revision = "e5e61229871744a062ae75651d3c442bae910b5d"
          legacy_status_revision = legacy_bootstrap_revision[:12]
          status = None
          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(base + "/api/pause", data=b"{}", headers={**headers, "Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(request, timeout=20) as response:
                      json.load(response)
              except Exception as exc:
                  print(f"pause mutation attempt={attempt} response={type(exc).__name__}; checking durable state", flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + "/api/status", headers=headers), timeout=20) as response:
                      status = json.load(response)
                  if (
                      status.get("execution_paused") is True
                      and status.get("manual_admin_pause") is True
                      and status.get("live_armed") is False
                      and status.get("bitfinex_live_enabled") is False
                      and status.get("force_paper_mode") is True
                  ):
                      break
              except Exception as exc:
                  print(f"pause state attempt={attempt} response={type(exc).__name__}", flush=True)
              time.sleep(min(2 * attempt, 8))
          else:
              raise SystemExit("durable paper maintenance boundary was not confirmed")
          def request_json(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  base + path, data=data,
                  headers={**headers, **({"Content-Type": "application/json"} if data else {})},
                  method="POST" if data else "GET",
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          def require_legacy_bootstrap_status(*, require_flat):
              legacy_status = request_json("/api/status")
              progress = legacy_status.get("strategy_progress") or {}
              try:
                  open_positions = int(progress.get("open_positions") or 0)
                  pending_orders = int(progress.get("pending_orders") or 0)
              except (TypeError, ValueError):
                  raise SystemExit("legacy bootstrap status counts are invalid")
              safe = (
                  str(legacy_status.get("source_git_rev") or "") == legacy_status_revision
                  and legacy_status.get("execution_paused") is True
                  and legacy_status.get("manual_admin_pause") is True
                  and legacy_status.get("force_paper_mode") is True
                  and legacy_status.get("live_armed") is False
                  and legacy_status.get("bitfinex_live_enabled") is False
              )
              if not safe:
                  raise SystemExit("generation-less relay authority is not the exact safe legacy bootstrap revision")
              if require_flat and (open_positions != 0 or pending_orders != 0):
                  return False
              return True
          def prove_legacy_bootstrap_flat():
              confirmations = 0
              last_snapshot_seq = None
              for attempt in range(1, 21):
                  candidate = request_json("/api/relay-execution-state?fresh=1")
                  generation = candidate.get("money_state_generation")
                  if isinstance(generation, int) and not isinstance(generation, bool):
                      raise SystemExit("relay generation appeared during legacy flat proof; restart with the normal fence")
                  if not isinstance(candidate.get("orders"), list) or not isinstance(candidate.get("positions"), list):
                      raise SystemExit("legacy bootstrap relay exposure arrays are missing")
                  orders = candidate.get("orders") or []
                  positions = candidate.get("positions") or []
                  sequence = candidate.get("snapshot_seq")
                  sequence_advanced = (
                      isinstance(sequence, int)
                      and not isinstance(sequence, bool)
                      and (last_snapshot_seq is None or sequence > last_snapshot_seq)
                  )
                  status_flat = require_legacy_bootstrap_status(require_flat=True)
                  if not orders and not positions and status_flat and sequence_advanced:
                      confirmations += 1
                      last_snapshot_seq = sequence
                      if confirmations >= 3:
                          return candidate
                  else:
                      confirmations = 0
                      last_snapshot_seq = sequence if isinstance(sequence, int) else None
                  time.sleep(min(attempt, 3))
              raise SystemExit("legacy bootstrap did not produce three advancing flat relay snapshots with flat status")
          def fresh_exposure(minimum_generation=None):
              last = None
              for attempt in range(1, 21):
                  try:
                      candidate = request_json("/api/relay-execution-state?fresh=1")
                      generation = candidate.get("money_state_generation")
                      if not isinstance(generation, int) or isinstance(generation, bool):
                          if minimum_generation is not None:
                              raise SystemExit("relay execution generation disappeared after a fenced mutation")
                          require_legacy_bootstrap_status(require_flat=False)
                          candidate["_legacy_exact_revision_bootstrap"] = True
                          return candidate
                      if minimum_generation is None or generation >= minimum_generation:
                          return candidate
                      last = f"generation {generation} < {minimum_generation}"
                  except urllib.error.HTTPError as exc:
                      if exc.code != 503:
                          raise
                      last = "503 rebuilding generation-matching authority"
                  time.sleep(min(attempt, 5))
              raise SystemExit(f"generation-matching relay authority unavailable: {last}")
          required_generation = None
          for round_no in range(1, 4):
              exposure = fresh_exposure(required_generation)
              if not isinstance(exposure.get("orders"), list) or not isinstance(exposure.get("positions"), list):
                  raise SystemExit("authenticated maintenance exposure arrays are missing")
              orders = sorted({str(row.get("trade_id") or "").strip() for row in exposure.get("orders") or []} - {""})
              positions = sorted({str(row.get("trade_id") or "").strip() for row in exposure.get("positions") or []} - {""})
              round_generation = exposure.get("money_state_generation")
              if not orders and not positions:
                  if exposure.get("_legacy_exact_revision_bootstrap") is True:
                      prove_legacy_bootstrap_flat()
                      print(f"Exact-revision legacy bootstrap boundary is flat after round {round_no}")
                      break
                  if required_generation is not None and exposure.get("money_state_generation") < required_generation:
                      raise SystemExit("flat relay authority predates maintenance mutations")
                  print(f"Durable maintenance boundary is flat after round {round_no}")
                  break
              for trade_id in orders:
                  try:
                      cancelled = request_json("/api/orders/cancel", {"trade_id": trade_id})
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404 or exposure.get("_legacy_exact_revision_bootstrap") is not True:
                          raise
                      # The legacy relay cache may name an order already removed
                      # from authoritative state.  Accept that idempotent race only
                      # inside the exact revision bridge; the advancing three-sample
                      # flat proof below remains mandatory before deployment.
                      cancelled = {"status": "not_found"}
                      print(f"Legacy maintenance order already absent trade_id={trade_id}", flush=True)
                  if cancelled.get("status") == "not_found":
                      continue
                  if cancelled.get("status") != "cancelled":
                      raise SystemExit(f"maintenance cancel was not confirmed for {trade_id}")
                  generation = cancelled.get("money_state_generation")
                  if exposure.get("_legacy_exact_revision_bootstrap") is True:
                      if isinstance(generation, int) and not isinstance(generation, bool):
                          raise SystemExit("relay generation appeared without a legacy mutation baseline")
                      continue
                  if not isinstance(generation, int) or isinstance(generation, bool):
                      raise SystemExit("maintenance cancel generation is missing")
                  if generation <= round_generation:
                      raise SystemExit("maintenance cancel did not advance relay authority generation")
                  round_generation = generation
                  required_generation = max(required_generation or 0, generation)
              for trade_id in positions:
                  reconciled = request_json("/api/reconcile/phantom-cancel", {"trade_id": trade_id, "reason": "GUARDED_DEPLOY_MAINTENANCE_BOUNDARY"})
                  if reconciled.get("ok") is not True:
                      raise SystemExit(f"maintenance paper reconciliation was not confirmed for {trade_id}")
                  generation = reconciled.get("money_state_generation")
                  if exposure.get("_legacy_exact_revision_bootstrap") is True:
                      if isinstance(generation, int) and not isinstance(generation, bool):
                          raise SystemExit("relay generation appeared without a legacy mutation baseline")
                      continue
                  if not isinstance(generation, int) or isinstance(generation, bool):
                      raise SystemExit("maintenance reconciliation generation is missing")
                  if generation <= round_generation:
                      raise SystemExit("maintenance reconciliation did not advance relay authority generation")
                  round_generation = generation
                  required_generation = max(required_generation or 0, generation)
              if exposure.get("_legacy_exact_revision_bootstrap") is True:
                  prove_legacy_bootstrap_flat()
                  print(f"Exact-revision legacy bootstrap mutations are flat after round {round_no}")
                  break
              time.sleep(2)
          else:
              raise SystemExit("maintenance boundary did not become flat")
          PY

      - name: Prove the current Fly owner and every relay account are flat
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          PLATFORM_API_URL: "https://doxed-founders-website-production.up.railway.app/api"
          REQUIRE_BOT_ADMIN_TOKEN: "YES"
          REQUIRE_CANONICAL_FLY_OWNER: "YES"
          SHOWCASE_OWNER_URL: "https://doxed-btc-bot.fly.dev"
        run: node scripts/check-relay-flat.mjs

      - name: Prove exact unready Fly revision and every durable relay account is flat
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover-unready'
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_BOT_ADMIN_TOKEN: "NO"
          REQUIRE_CANONICAL_FLY_OWNER: "NO"
          DURABLE_RELAYS_ONLY_RECOVERY: "YES"
          SHOWCASE_OWNER_URL: "https://doxed-btc-bot.fly.dev"
          EXPECTED_UNREADY_REVISION: ${{ inputs.expected_unready_revision }}
          RECOVERY_FAILED_RUN_ID: ${{ inputs.recovery_failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          expected = str(os.environ.get("EXPECTED_UNREADY_REVISION") or "").strip()
          run_id = str(os.environ.get("RECOVERY_FAILED_RUN_ID") or "").strip()
          if len(expected) != 12:
              raise SystemExit("recover-unready requires an exact 12-character revision")
          if not run_id.isdigit():
              raise SystemExit("recover-unready requires the failed deployment run id")
          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  return json.load(response)
          run = fetch(f"{base}/runs/{run_id}")
          if str(run.get("head_sha") or "")[:12] != expected or run.get("conclusion") != "failure":
              raise SystemExit("recovery run does not bind the expected failed revision")
          jobs = fetch(f"{base}/runs/{run_id}/jobs?per_page=100").get("jobs") or []
          steps = [step for job in jobs for step in (job.get("steps") or [])]
          deployed = any(step.get("name") == "Deploy the exact source revision" and step.get("conclusion") == "success" for step in steps)
          failed_liveness = any(step.get("name") == "Prove liveness, execution safety, and exact revision" and step.get("conclusion") == "failure" for step in steps)
          if not deployed or not failed_liveness:
              raise SystemExit("recovery run lacks successful deploy plus failed post-deploy liveness proof")
          print(f"Exact unready recovery target proven by Actions run {run_id}: {expected}")
          PY
          node scripts/check-relay-flat.mjs

      - name: Prove stalled runtime recovery from the last guarded deployment
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover-stalled-runtime'
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REQUIRE_BOT_ADMIN_TOKEN: "NO"
          REQUIRE_CANONICAL_FLY_OWNER: "NO"
          DURABLE_RELAYS_ONLY_RECOVERY: "YES"
          SHOWCASE_OWNER_URL: "https://doxed-btc-bot.fly.dev"
          EXPECTED_UNREADY_REVISION: ${{ inputs.expected_unready_revision }}
          RECOVERY_PROOF_RUN_ID: ${{ inputs.recovery_failed_run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          expected = str(os.environ.get("EXPECTED_UNREADY_REVISION") or "").strip()
          run_id = str(os.environ.get("RECOVERY_PROOF_RUN_ID") or "").strip()
          if len(expected) != 12 or not run_id.isdigit():
              raise SystemExit("stalled-runtime recovery requires exact revision and proof run")
          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=15) as response:
                  return json.load(response)
          run = fetch(f"{base}/runs/{run_id}")
          if str(run.get("head_sha") or "")[:12] != expected or run.get("conclusion") != "success":
              raise SystemExit("proof run is not the successful guarded deployment of the expected revision")
          jobs = fetch(f"{base}/runs/{run_id}/jobs?per_page=100").get("jobs") or []
          steps = [step for job in jobs for step in (job.get("steps") or [])]
          required = {
              "Deploy the exact source revision",
              "Prove liveness, execution safety, and exact revision",
          }
          passed = {step.get("name") for step in steps if step.get("conclusion") == "success"}
          if not required.issubset(passed):
              raise SystemExit("proof run lacks guarded deploy and post-deploy safety receipts")
          print(f"Stalled runtime recovery anchored to guarded deployment {run_id}: {expected}")
          PY
          node scripts/check-relay-flat.mjs

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Recheck maintenance boundary immediately before deploy
        working-directory: ${{ github.workspace }}
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          request = urllib.request.Request("https://doxed-btc-bot.fly.dev/api/status", headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              status = json.load(response)
          progress = status.get("strategy_progress") or {}
          if not (
              status.get("execution_paused") is True
              and status.get("manual_admin_pause") is True
              and status.get("live_armed") is False
              and status.get("bitfinex_live_enabled") is False
              and status.get("force_paper_mode") is True
              and int(progress.get("open_positions") or 0) == 0
              and int(progress.get("pending_orders") or 0) == 0
          ):
              raise SystemExit("maintenance boundary or flatness changed before deploy")
          print("Maintenance boundary remains paused, disarmed, and flat immediately before deploy")
          PY

      - name: Deploy the exact source revision
        run: flyctl deploy --remote-only --strategy immediate --build-arg SOURCE_GIT_REV="${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Prove liveness, execution safety, and exact revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import combo_pathway_config as registry

          expected = os.environ["EXPECTED_REVISION"][:12]
          base = "https://doxed-btc-bot.fly.dev"
          expected_signature = registry.active_tile_registry_signature()
          expected_lanes = list(registry.ACTIVE_TILE_ORDER)
          last = ""
          deadline = time.monotonic() + 12 * 60
          attempt = 0
          while time.monotonic() < deadline:
              attempt += 1
              try:
                  stage_started = time.monotonic()
                  with urllib.request.urlopen(base + "/health", timeout=8) as response:
                      liveness = json.load(response)
                  print(
                      f"postdeploy attempt={attempt} stage=health status={response.status} "
                      f"latency_ms={round((time.monotonic() - stage_started) * 1000)}",
                      flush=True,
                  )
                  # The dashboard socket binds before private state restoration
                  # completes. During that bounded startup window /health
                  # deliberately returns a minimal 200 payload without strategy
                  # progress or tile fields. Treat only that explicit startup
                  # contract as retryable; all post-bootstrap evidence remains
                  # mandatory below.
                  if (
                      liveness.get("boot") == "starting"
                      and liveness.get("status") == "starting"
                  ):
                      last = (
                          "Fly dashboard bootstrap is still starting: "
                          + json.dumps(liveness, sort_keys=True)
                      )
                      time.sleep(3)
                      continue
                  stage_started = time.monotonic()
                  with urllib.request.urlopen(base + "/api/status", timeout=8) as status_response:
                      payload = json.load(status_response)
                  print(
                      f"postdeploy attempt={attempt} stage=status status={status_response.status} "
                      f"latency_ms={round((time.monotonic() - stage_started) * 1000)}",
                      flush=True,
                  )
                  stage_started = time.monotonic()
                  with urllib.request.urlopen(base + "/ready", timeout=8) as ready_response:
                      ready = json.load(ready_response)
                  print(
                      f"postdeploy attempt={attempt} stage=ready status={ready_response.status} "
                      f"latency_ms={round((time.monotonic() - stage_started) * 1000)}",
                      flush=True,
                  )
                  last = json.dumps(payload, sort_keys=True)
                  progress = payload.get("strategy_progress") or {}
                  runtime_lanes = [row.get("lane") for row in payload.get("active_tiles") or []]
                  if (
                      response.status == 200
                      and status_response.status == 200
                      and liveness.get("process_alive") is True
                      and ready_response.status == 200
                      and ready.get("ok") is True
                      and payload.get("process_alive") is True
                      and str(payload.get("source_git_rev") or "").startswith(expected)
                      and payload.get("bot_version") == registry.EXECUTION_FIX_VERSION
                      and payload.get("tile_registry_signature") == expected_signature
                      and ready.get("tile_registry_signature") == expected_signature
                      and runtime_lanes == expected_lanes
                      and progress.get("ok") is True
                      and progress.get("trade_lock_available") is True
                      and int(progress.get("open_positions") or 0) == 0
                      and int(progress.get("pending_orders") or 0) == 0
                      and payload.get("execution_paused") is True
                      and payload.get("manual_admin_pause") is True
                  ):
                      health = payload
                      if (
                          health.get("live_armed") is False
                          and health.get("bitfinex_live_enabled") is False
                          and health.get("force_paper_mode") is True
                      ):
                          print(
                              f"Fly alive, disarmed, paper-signal-only, "
                              f"on exact revision {expected}"
                          )
                          raise SystemExit(0)
                      last = f"unsafe Fly execution flags: {health}"
              except Exception as exc:
                  last = str(exc)
                  print(
                      f"postdeploy attempt={attempt} stage=request status=failed "
                      f"error={type(exc).__name__}:{exc}",
                      flush=True,
                  )
              time.sleep(3)
          raise SystemExit(f"Fly failed exact-revision liveness proof: {last}")
          PY

      - name: Resume paper execution after exact-revision acceptance
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          expected = os.environ["EXPECTED_REVISION"][:12]
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          request = urllib.request.Request(base + "/api/resume", data=b"{}", headers={**headers, "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              resumed = json.load(response)
          if resumed.get("status") != "resumed" or resumed.get("execution_paused") is not False:
              raise SystemExit("paper resume was not acknowledged")
          last = None
          for _ in range(20):
              with urllib.request.urlopen(urllib.request.Request(base + "/api/status", headers=headers), timeout=20) as response:
                  status = json.load(response)
              last = status
              if (
                  str(status.get("source_git_rev") or "").startswith(expected)
                  and status.get("execution_paused") is False
                  and status.get("manual_admin_pause") is False
                  and status.get("live_armed") is False
                  and status.get("bitfinex_live_enabled") is False
                  and status.get("force_paper_mode") is True
              ):
                  print(f"Paper execution resumed on exact accepted revision {expected}; live remains disarmed")
                  raise SystemExit(0)
              time.sleep(3)
          raise SystemExit("exact-revision paper resume confirmation failed: " + json.dumps(last, sort_keys=True))
          PY

      - name: Best-effort safe paper resume after failed guarded deploy
        if: failure()
        continue-on-error: true
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          with urllib.request.urlopen(urllib.request.Request(base + "/api/status", headers=headers), timeout=20) as response:
              status = json.load(response)
          if not (
              status.get("force_paper_mode") is True
              and status.get("live_armed") is False
              and status.get("bitfinex_live_enabled") is False
              and status.get("manual_admin_pause") is True
          ):
              raise SystemExit("failed deploy left no safely resumable paper-only maintenance boundary")
          request = urllib.request.Request(base + "/api/resume", data=b"{}", headers={**headers, "Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=30) as response:
              resumed = json.load(response)
          if resumed.get("status") != "resumed" or resumed.get("execution_paused") is not False:
              raise SystemExit("bounded failure-path paper resume was rejected")
          print("Failure-path paper resume acknowledged; live remains disabled and disarmed")
          PY
