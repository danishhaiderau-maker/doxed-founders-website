name: Auto-Deploy Production

on:
  push:
    branches:
      - master
    paths-ignore:
      # Don't trigger on bot research artifacts, local snapshots, or docs-only changes
      - 'services/btc-conservative-agent/**'
      - 'services/btc-signal-engine/**'
      - '.edge-analysis/**'
      - 'docs/**'
      - '**/*.md'
      - '**/.cursor/rules/**'
      # founder-os agent memory-sync noise (1-line tasks.json changes)
      - '.github/founder-os/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Run normal deploy, a flat proof, or the isolated paused-credential API rollout
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - flat-check-only
          - api-control-plane-credential-refresh
      target_instance_id:
        description: Exact paused Bitfinex instance id (required only for isolated credential API rollout)
        required: false
        type: string
      expected_commit_sha:
        description: Exact 40-character commit to deploy (required only for isolated credential API rollout)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: auto-deploy-production
  cancel-in-progress: false

jobs:
  flat-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'flat-check-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma@6.8.2 generate --schema prisma/schema.prisma

      - name: Prove simultaneous raw flat boundary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          PLATFORM_API_URL: https://doxed-founders-website-production.up.railway.app/api
          REQUIRE_BOT_ADMIN_TOKEN: YES
          REQUIRE_CANONICAL_FLY_OWNER: YES
          SHOWCASE_OWNER_URL: https://doxed-btc-bot.fly.dev
        run: node scripts/check-relay-flat.mjs

  api-control-plane-credential-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'api-control-plane-credential-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate dispatch identity
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          test -n "${{ inputs.target_instance_id }}"
          test "$EXPECTED_COMMIT_SHA" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor 3cdefa4f0dfead539c78de08a75c8ee817c6170b "$EXPECTED_COMMIT_SHA"

      - name: Install and verify isolated rollout contract
        run: |
          npm ci
          npx prisma@6.8.2 generate --schema prisma/schema.prisma
          npm run build:utils
          npm run build --workspace=@dcf/api
          npm test --workspace=@dcf/api
          node --test scripts/deploy-paused-credential-api.spec.mjs

      - name: Prove target relay is durably paused and disarmed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_INSTANCE_ID: ${{ inputs.target_instance_id }}
        run: node scripts/deploy-paused-credential-api.mjs prove-paused

      - name: Snapshot isolated executor deployment
        id: before
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          node scripts/deploy-paused-credential-api.mjs snapshot > topology.json
          node -e "const x=require('./topology.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'executor_deployment_id='+x.executorDeploymentId+'\n')"
          node -e "const x=require('./topology.json'); console.log(JSON.stringify({apiStatus:x.apiStatus,executorStatus:x.executorStatus,executorDeploymentId:x.executorDeploymentId}))"

      - name: Deploy exact revision to API control plane only
        id: api_deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        run: |
          node scripts/deploy-paused-credential-api.mjs deploy > api-deployment.json
          node -e "const x=require('./api-deployment.json'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'deployment_id='+x.deploymentId+'\n')"
          node -e "const x=require('./api-deployment.json'); console.log(JSON.stringify({ok:x.ok,deploymentId:x.deploymentId,service:x.service,commitSha:x.commitSha}))"

      - name: Verify exact API revision, route, and untouched executor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_INSTANCE_ID: ${{ inputs.target_instance_id }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          EXPECTED_API_DEPLOYMENT_ID: ${{ steps.api_deploy.outputs.deployment_id }}
          EXPECTED_EXECUTOR_DEPLOYMENT_ID: ${{ steps.before.outputs.executor_deployment_id }}
        run: |
          node scripts/deploy-paused-credential-api.mjs verify
          node scripts/deploy-paused-credential-api.mjs prove-paused

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for schema changes
        id: schema
        run: |
          git fetch origin master --depth=2
          if git diff --name-only HEAD~1 HEAD | grep -q '^prisma/schema.prisma$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Prisma schema changed — will push to Neon"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No schema changes — skipping Neon push"
          fi

      - name: Push Prisma schema to Neon
        if: steps.schema.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci-neon-schema-push.mjs

      - name: Generate Prisma client
        run: npx prisma@6.8.2 generate --schema prisma/schema.prisma

      - name: Build utils package
        run: npm run build:utils

      - name: Type-check API
        run: npm run build --workspace=@dcf/api

      - name: Run tests
        run: |
          npm test --workspace=@dcf/utils
          npm test --workspace=@dcf/api
          npm test --workspace=@dcf/web
          node --test scripts/check-relay-flat.spec.mjs
          node --test scripts/relay-revision-policy.spec.mjs
          node --test scripts/fly-bot-runtime-contract.spec.mjs
          node --test scripts/bot-sync-guard.spec.mjs

      - name: Build web (catch Vercel build errors before Vercel does)
        run: npm run build --workspace=@dcf/web
        env:
          NEXTAUTH_URL: https://doxxedcrypto.digital
          PUBLIC_SITE_URL: https://doxxedcrypto.digital

      # A Railway release restarts the isolated relay executor.  Never roll
      # that money-path runtime while the canonical Showcase or any relay
      # account has live orders/positions; wait for a true flat boundary.
      - name: Prove live relay flat boundary before restart
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          PLATFORM_API_URL: https://doxed-founders-website-production.up.railway.app/api
          REQUIRE_BOT_ADMIN_TOKEN: YES
          REQUIRE_CANONICAL_FLY_OWNER: YES
          SHOWCASE_OWNER_URL: https://doxed-btc-bot.fly.dev
        run: node scripts/check-relay-flat.mjs

      - name: Trigger Railway redeploy
        id: railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node scripts/ci-railway-redeploy.mjs

      - name: Wait for Vercel + Railway to settle
        run: |
          echo "Waiting 120s for Vercel auto-deploy + Railway rebuild to start..."
          echo "Railway step outcome: ${{ steps.railway.outcome }}"
          echo "Both the public API and isolated relay executor are required."
          sleep 120

      - name: Verify isolated relay executor revision
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          RELAY_REVISION_TIMEOUT_MS: 120000
        run: node scripts/verify-relay-executor-revision.mjs

      - name: Smoke test production
        env:
          API_URL: https://doxxedcrypto.digital
        run: node scripts/smoke-test.mjs

      - name: Report status
        if: always()
        run: |
          echo "### Auto-Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Site:** https://doxxedcrypto.digital" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** https://doxed-founders-website-production.up.railway.app/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Schema push:** ${{ steps.schema.outputs.changed == 'true' && 'applied' || 'skipped (no changes)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel:** auto-deployed from GitHub (check Vercel dashboard)" >> $GITHUB_STEP_SUMMARY
          echo "- **Railway redeploy:** ${{ steps.railway.outcome }} (API + isolated relay executor required)" >> $GITHUB_STEP_SUMMARY
