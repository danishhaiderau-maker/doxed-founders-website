name: Fly archive ACKed rotated market once

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect/hash only when true; move when false+apply
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      apply:
        description: Must be true with dry_run=false to actually move files
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      expected_epoch:
        description: Live epoch id (informational; refuse if active writers mismatch)
        required: true
        default: epoch-v22-51e7a8d95b4a233813fa
        type: string
      mode:
        description: closed_family=any stem.jsonl.N (N>=1); acked_sha=exact sealed pins; inspect=disk+invent dump
        required: true
        default: closed_family
        type: choice
        options:
          - closed_family
          - acked_sha
          - inspect

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Quarantine closed jsonl rotations (invent shrink)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPLY: ${{ inputs.apply }}
          EXPECTED_EPOCH: ${{ inputs.expected_epoch }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[row for row in rows if str(row.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=${machine_id}"
          script_b64="$(base64 -w0 diagnostics/fly-archive-acked-rotated-market.py)"
          flyctl machine exec --app doxed-btc-bot --timeout 60 "${machine_id}" \
            "sh -lc 'echo ${script_b64} | base64 -d > /tmp/fly-archive-acked-rotated-market.py && wc -c /tmp/fly-archive-acked-rotated-market.py'"
          flyctl machine exec --app doxed-btc-bot --timeout 30 "${machine_id}" \
            "sh -lc 'rm -f /tmp/archive_out.json /tmp/archive_rc.txt; setsid nohup sh -c \"DRY_RUN=${DRY_RUN} APPLY=${APPLY} MODE=${MODE} EXPECTED_EPOCH=${EXPECTED_EPOCH} DATA_ROOT=/app/data PYTHONUNBUFFERED=1 python -u /tmp/fly-archive-acked-rotated-market.py > /tmp/archive_out.json 2>&1; echo \\$? > /tmp/archive_rc.txt\" </dev/null >/dev/null 2>&1 & echo LAUNCHED=\$!'"
          python - <<'PY'
          import json, subprocess, time, sys
          mid = subprocess.check_output(["flyctl","machines","list","--app","doxed-btc-bot","--json"], text=True)
          rows=json.loads(mid)
          machine=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}][0]["id"]
          deadline=time.time()+2400
          body=""
          while time.time()<deadline:
              p=subprocess.run(["flyctl","machine","exec","--app","doxed-btc-bot","--timeout","60",machine,
                "sh -lc 'echo RC=$(cat /tmp/archive_rc.txt 2>/dev/null || echo missing); wc -c /tmp/archive_out.json 2>/dev/null; tail -n 3 /tmp/archive_out.json 2>/dev/null || true'"],
                text=True, capture_output=True)
              body=(p.stdout or "")+(("\n"+p.stderr) if p.stderr else "")
              print(body[-2500:], flush=True)
              if "RC=0" in body or "RC=1" in body:
                  break
              time.sleep(15)
          else:
              raise SystemExit("archive timed out")
          p=subprocess.run(["flyctl","machine","exec","--app","doxed-btc-bot","--timeout","90",machine,
            "sh -lc 'cat /tmp/archive_out.json'"], text=True, capture_output=True)
          text=(p.stdout or "")+(("\n"+p.stderr) if p.stderr else "")
          print(text, flush=True)
          # Prefer JSON ok flag
          ok=False
          for line in text.splitlines():
              s=line.strip()
              if s.startswith("{") and '"schema"' in s:
                  try:
                      obj=json.loads(s); ok=obj.get("ok") is True
                  except Exception:
                      pass
          if not ok and '"ok": true' not in text and '"ok":true' not in text:
              # Multi-line JSON: parse whole
              try:
                  start=text.find("{"); end=text.rfind("}")
                  if start>=0 and end>start:
                      obj=json.loads(text[start:end+1]); ok=obj.get("ok") is True
                      print(json.dumps({"parsed_ok": ok, "eligible_mib": obj.get("eligible_mib"), "bytes_moved_mib": obj.get("bytes_moved_mib"), "noop": obj.get("noop_reason")}, sort_keys=True), flush=True)
              except Exception as exc:
                  print(f"parse_err:{exc}", flush=True)
          if not ok:
              raise SystemExit("archive not ok")
          PY
