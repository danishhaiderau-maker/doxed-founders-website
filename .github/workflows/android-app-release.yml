name: Release Android App

on:
  push:
    tags:
      - 'android-app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate app icons
        run: node scripts/generate-founder-node-icon.mjs

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/pack-android-app.mjs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxxedcrypto-android
          path: |
            apps/mobile-android/release/*.apk
            apps/web/public/downloads/doxxedcrypto-android.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/android-app-v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: doxxedcrypto-android
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Doxxed Crypto Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release/**/*.apk
