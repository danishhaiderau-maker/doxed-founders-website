name: Fly monitor CI

on:
  pull_request:
    paths:
      - ".github/workflows/fly-bot-monitor.yml"
      - ".github/workflows/fly-monitor-ci.yml"
      - "scripts/fly_monitor_*.py"
      - "scripts/test_fly_monitor_*.py"
      - "scripts/test-fly-workflow-revision-contract.py"
      - "scripts/fly-bot-runtime-contract.spec.mjs"
      - "tests/test_fly_bot_monitor_contract.py"

permissions:
  contents: read

jobs:
  monitor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install pytest
      - name: Monitor dedup policy, probe retries, and contract fixtures
        working-directory: scripts
        run: python -m pytest test_fly_monitor_alerts.py test_fly_monitor_run.py test_fly_monitor_contract.py test-fly-workflow-revision-contract.py ../tests/test_fly_bot_monitor_contract.py -q
      - name: Runtime contract spec
        run: node --test scripts/fly-bot-runtime-contract.spec.mjs
