name: Rearm Bitfinex live copy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ARM_NEXT_FRESH_ONLY to confirm the guarded production re-arm
        required: true
        type: string
      executor_revision:
        description: Exact healthy executor revision already verified in production
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bitfinex-live-copy-operator
  cancel-in-progress: false

jobs:
  rearm:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate explicit confirmation
        shell: bash
        run: test '${{ inputs.confirmation }}' = 'ARM_NEXT_FRESH_ONLY'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Guard and re-arm next fresh signal only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONFIRM_RELAY_REARM: ${{ inputs.confirmation }}
          EXPECTED_EXECUTOR_REVISION: ${{ inputs.executor_revision }}
          RELAY_INSTANCE_ID: cmq6cfwv4001jli0dqx5r31ve
        run: node scripts/rearm-live-copy-guarded.mjs
