name: Fly invent du probe once
on:
  workflow_dispatch:
jobs:
  du:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: du invent-ish roots
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          mid="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; print(active[0]["id"])')"
          echo "MACHINE_ID=$mid"
          flyctl machine exec --app doxed-btc-bot --timeout 90 "$mid" \
            "sh -lc 'echo === runtime_top ===; du -sm /app/data/runtime/* 2>/dev/null | sort -n | tail -n 40; echo === v3 ===; du -sm /app/data/runtime/v3/* 2>/dev/null | sort -n | tail -n 30; echo === research ===; du -sm /app/data/runtime/research/* 2>/dev/null | sort -n | tail -n 20; echo === data_top ===; du -sm /app/data/* 2>/dev/null | sort -n | tail -n 20; echo === large_files ===; find /app/data/runtime -type f -size +5M ! -path \"*/research_archive/*\" ! -path \"*/.locks/*\" ! -path \"*/.data-sync-snapshots/*\" -printf \"%s %p\\n\" 2>/dev/null | sort -n | tail -n 40'"
