name: Release Founder Node

on:
  push:
    tags:
      - 'founder-node-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack Founder Node (${{ matrix.platform }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: node scripts/pack-founder-node.mjs --${{ matrix.platform }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: founder-node-${{ matrix.platform }}
          path: apps/founder-node/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/founder-node-v')

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: founder-node-win
          path: release/win

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: founder-node-mac
          path: release/mac

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Founder Node ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/win/*
            release/mac/*
