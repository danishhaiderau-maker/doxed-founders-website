name: Release Founder Node

on:
  push:
    tags:
      - 'founder-node-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Founder Node workspace deps
        run: npm install --workspace=@dcf/founder-node --include=dev

      - name: Clean release output
        shell: bash
        run: node -e "require('fs').rmSync('apps/founder-node/release',{recursive:true,force:true})"

      - name: Generate app icons
        run: node scripts/generate-founder-node-icon.mjs

      - name: Build workspace packages
        run: npm run build:utils

      - name: Build Founder Node
        run: npm run build --workspace=@dcf/founder-node

      - name: Prepare packaging layout
        run: node scripts/prepare-founder-node-pack.mjs

      - name: Pack Founder Node (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/founder-node
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win portable --x64

      - name: Pack Founder Node (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/founder-node
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac dmg --x64

      - name: List release output
        if: always()
        shell: bash
        run: |
          echo "Release directory:"
          ls -la apps/founder-node/release/ || true
          echo "Recursive:"
          find apps/founder-node/release -maxdepth 2 -type f 2>/dev/null || true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: founder-node-${{ matrix.platform }}
          path: |
            apps/founder-node/release/*.exe
            apps/founder-node/release/*.dmg
          if-no-files-found: error

      - name: Upload pack debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: founder-node-debug-${{ matrix.platform }}
          path: |
            apps/founder-node/release/**
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/founder-node-v')

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: founder-node-win
          path: release/win

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: founder-node-mac
          path: release/mac

      - name: List release assets
        run: |
          echo "Windows:"
          ls -la release/win/ 2>/dev/null || echo "(none)"
          echo "macOS:"
          ls -la release/mac/ 2>/dev/null || echo "(none)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Founder Node ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/win/*
            release/mac/*
