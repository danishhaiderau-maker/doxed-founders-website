name: Release Founder Node

on:
  push:
    tags:
      - 'founder-node-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            pack_cmd: npx electron-builder --win nsis --x64 --publish never
          - os: macos-latest
            platform: mac
            pack_cmd: npx electron-builder --mac dmg --arm64 --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean release output
        shell: bash
        run: node -e "require('fs').rmSync('apps/founder-node/release',{recursive:true,force:true})"

      - name: Generate app icons
        run: node scripts/generate-founder-node-icon.mjs

      - name: Build workspace packages
        run: npm run build:utils

      - name: Build Founder Node
        run: npm run build --workspace=@dcf/founder-node

      - name: Prepare packaging layout
        run: node scripts/prepare-founder-node-pack.mjs

      - name: Pack Founder Node
        working-directory: apps/founder-node
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.pack_cmd }}

      - name: List release output
        if: always()
        shell: bash
        run: |
          echo "Release directory:"
          ls -la apps/founder-node/release/ || true
          find apps/founder-node/release -maxdepth 1 -type f 2>/dev/null || true

      - name: Verify installer exists
        shell: bash
        run: |
          set -e
          shopt -s nullglob 2>/dev/null || true
          files=(apps/founder-node/release/*.exe apps/founder-node/release/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            files=(apps/founder-node/release/**/*.exe apps/founder-node/release/**/*.dmg)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .exe or .dmg produced"
            find apps/founder-node/release -type f 2>/dev/null || true
            exit 1
          fi
          ls -la "${files[@]}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: founder-node-${{ matrix.platform }}
          path: |
            apps/founder-node/release/*.exe
            apps/founder-node/release/*.dmg
          if-no-files-found: error

      - name: Upload pack debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: founder-node-debug-${{ matrix.platform }}
          path: apps/founder-node/release/**
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/founder-node-v')

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: founder-node-win
          path: release/win

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: founder-node-mac
          path: release/mac

      - name: List release assets
        run: |
          echo "Windows:" && ls -la release/win/ 2>/dev/null || echo "(none)"
          echo "macOS:" && ls -la release/mac/ 2>/dev/null || echo "(none)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Founder Node ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/win/*.exe
            release/win/*.dmg
            release/mac/*.exe
            release/mac/*.dmg
