name: Engagement lottery daily

on:
  schedule:
    # 10:00 UTC daily — paper cash for top active community members
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily engagement lottery
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_SYNC_JWT: ${{ secrets.ADMIN_SYNC_JWT }}
        run: node scripts/run-engagement-lottery.mjs
