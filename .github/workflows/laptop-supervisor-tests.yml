name: laptop-supervisor-tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  supervisor-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest tzdata cryptography
      - name: Deterministic supervisor and prototype mutation inventory
        run: python -B -m pytest scripts/pmc_supervisor_tests -q -p no:cacheprovider
  supervisor-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install pytest tzdata cryptography pyarrow
      - name: Real Windows Jobs, handles, declared-prototype mutations, Python311 and Arrow
        run: python -B -m pytest scripts/pmc_supervisor_tests -q -p no:cacheprovider
      - name: Keyless injected collector transport and PR999 regression tests
        run: >-
          python -B -m pytest services/public-market-collector/tests/test_daily_followup.py
          services/public-market-collector/tests/test_windows_priority.py -q -p no:cacheprovider
