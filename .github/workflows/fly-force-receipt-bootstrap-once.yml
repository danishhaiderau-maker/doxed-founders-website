name: Fly force receipt bootstrap once

# Freeze bot writers, force emergency idempotency bootstrap to all_complete,
# then let entrypoint revive the bot. Never arms Bitfinex.
#
# Constraints learned this incident:
# - ssh console hangs without starting freezer
# - nohup under machine-exec is reaped when exec returns
# - machine-exec HTTP 408 ~60s if streaming a long kill+bootstrap
# So: file-buffered chunks (guest budget clamped to <=150s so the guest stays
# on 256-record / 8MiB steps; larger budgets flip to 1024 / 16MiB and OOM),
# guest redirects to /tmp, then cat results.
# stdout phases (store_ready, advance_timeout, advance_error) are progress,
# not chunk results. Wait until a fresh STATUS_FILE is BOOTSTRAP_FORCED /
# BOOTSTRAP_PARTIAL / dry_run, or RC is terminal and output has stopped.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Must be true to mutate; false = probe only
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      expected_epoch:
        required: true
        default: epoch-281be253d7ee19636c6bf487
        type: string
      expected_revision:
        required: true
        default: "37f3a57a36db"
        type: string
      max_seconds:
        required: true
        default: "1200"
        type: string
      chunk_seconds:
        description: Guest chunk budget seconds. Clamped to at most 150 so bootstrap stays on 256-record/8MiB steps.
        required: false
        default: "180"
        type: string

jobs:
  force-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Pause paper and prove flat
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          expected = str(os.environ.get("EXPECTED_REVISION") or "").strip().lower()
          if not token: raise SystemExit("BOT_ADMIN_TOKEN missing")
          if not re.fullmatch(r"[0-9a-f]{12}", expected): raise SystemExit("bad revision")
          headers = {"X-Bot-Admin-Token": token, "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response: return json.load(response)
          status = call("/api/status")
          if str(status.get("source_git_rev") or "").lower() != expected:
              raise SystemExit(f"revision mismatch: {status.get('source_git_rev')}")
          if not (status.get("force_paper_mode") is True and status.get("bitfinex_live_enabled") is False and status.get("live_armed") is False):
              raise SystemExit("paper-only disarmed safety not proven")
          call("/api/pause", {})
          for _ in range(12):
              status = call("/api/status"); progress = status.get("strategy_progress") or {}
              if (status.get("execution_paused") is True and status.get("manual_admin_pause") is True
                  and int(progress.get("pending_orders") or 0) == 0 and int(progress.get("open_positions") or 0) == 0):
                  break
              time.sleep(2)
          else:
              raise SystemExit("flat paused boundary not proven")
          print(json.dumps({"maintenance":"flat_paused","revision":expected}, sort_keys=True))
          PY

      - name: Force receipt bootstrap via short file-buffered chunks
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
          EXPECTED_EPOCH: ${{ inputs.expected_epoch }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          CHUNK_SECONDS: ${{ inputs.chunk_seconds }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=${machine_id}"
          script_b64="$(base64 -w0 diagnostics/fly-force-receipt-bootstrap-once.py)"
          flyctl machine exec --app doxed-btc-bot --timeout 60 "${machine_id}" \
            "sh -lc 'echo ${script_b64} | base64 -d > /tmp/fly-force-receipt-bootstrap-once.py && wc -c /tmp/fly-force-receipt-bootstrap-once.py'"

          python - <<'PY'
          import json, os, subprocess, sys, time
          mid = subprocess.check_output(
              ["flyctl", "machines", "list", "--app", "doxed-btc-bot", "--json"], text=True,
          )
          rows = json.loads(mid)
          active = [r for r in rows if str(r.get("state") or "").lower() not in {"destroyed", "stopped"}]
          assert len(active) == 1, active
          machine = active[0]["id"]
          apply = os.environ["APPLY"].strip().lower() in {"1", "true", "yes"}
          epoch = os.environ["EXPECTED_EPOCH"]
          total = max(60, int(os.environ["MAX_SECONDS"]))
          # Default input is "180", but guest MAX_SECONDS > 150 switches the
          # bootstrap step to 1024 records / 16MiB and the machine OOMs.
          raw_chunk = str(os.environ.get("CHUNK_SECONDS") or "").strip() or "180"
          try:
              requested_chunk = int(raw_chunk)
          except ValueError:
              requested_chunk = 180
          if requested_chunk <= 0:
              requested_chunk = 180
          chunk_s = min(150, requested_chunk)
          elapsed = 0
          chunk = 0
          out_path = "/tmp/force_bootstrap_out.txt"
          open(out_path, "w", encoding="utf-8").close()

          def exec_cmd(command: str, timeout: int = 90) -> tuple[int, str]:
              proc = subprocess.run(
                  ["flyctl", "machine", "exec", "--app", "doxed-btc-bot",
                   "--timeout", str(timeout), machine, command],
                  text=True, capture_output=True,
              )
              text = (proc.stdout or "") + (("\n" + proc.stderr) if proc.stderr else "")
              return proc.returncode, text

          _PROGRESS_PHASES = {"store_ready", "advance_timeout", "advance_error"}

          def last_status(text: str):
              last = None
              last_with_status = None
              for line in text.splitlines():
                  s = line.strip()
                  if not s.startswith("{"):
                      continue
                  try:
                      obj = json.loads(s)
                  except Exception:
                      continue
                  last = obj
                  if isinstance(obj, dict) and (
                      obj.get("status") in {"BOOTSTRAP_FORCED", "BOOTSTRAP_PARTIAL"}
                      or obj.get("dry_run") is True
                  ):
                      last_with_status = obj
              return last_with_status or last

          def _rc_token(text: str):
              for line in text.splitlines():
                  if line.startswith("RC="):
                      return line.split("=", 1)[1].strip()
              return None

          def _rc_terminal(token) -> bool:
              if not token or token == "missing":
                  return False
              try:
                  int(token)
              except ValueError:
                  return False
              return True

          def _out_bytes(text: str):
              for line in text.splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and parts[0].isdigit() and parts[1].endswith("force_chunk_out.txt"):
                      return int(parts[0])
              return None

          def _terminal_status(obj) -> bool:
              return isinstance(obj, dict) and (
                  obj.get("status") in {"BOOTSTRAP_FORCED", "BOOTSTRAP_PARTIAL"}
                  or obj.get("dry_run") is True
              )

          def _progress_obj(obj) -> bool:
              # Intermediate guest phases are not a chunk result.
              if not isinstance(obj, dict) or _terminal_status(obj):
                  return False
              phase = obj.get("phase")
              if phase in _PROGRESS_PHASES or (isinstance(phase, str) and phase):
                  return True
              return any(key in obj for key in ("probe", "freezer_started", "round", "progress"))

          def _defer_provisional(obj, rc_token) -> bool:
              # pre_advance BOOTSTRAP_PARTIAL is a crash sentinel. Keep waiting
              # while the guest is still running so a live chunk is not cut off.
              return (
                  isinstance(obj, dict)
                  and obj.get("provisional") is True
                  and obj.get("status") == "BOOTSTRAP_PARTIAL"
                  and not _rc_terminal(rc_token)
              )

          def _fresh_status(text: str):
              if "STATUS_FILE={" not in text:
                  return None
              try:
                  raw = text.split("STATUS_FILE=", 1)[1].splitlines()[0].strip()
                  cand = json.loads(raw)
              except Exception:
                  return None
              if _terminal_status(cand):
                  return cand
              return None

          def _partial_from_dead_chunk(last, rc_token) -> dict:
              phase = last.get("phase") if isinstance(last, dict) else None
              if isinstance(last, dict) and last.get("status") == "BOOTSTRAP_PARTIAL" and last.get("provisional") is not True:
                  return last
              return {
                  "ok": True,
                  "status": "BOOTSTRAP_PARTIAL",
                  "deadline": True,
                  "rc": rc_token,
                  "phase": phase,
                  "observed": last if isinstance(last, dict) else None,
                  "reason": "terminal_rc_no_progress",
                  "source_cleanup_authorized": False,
              }

          def wait_chunk_result(timeout_s: int = 90):
              deadline = time.time() + timeout_s
              # If the guest is still in a progress phase and has not exited,
              # do not stop at the first deadline and hand store_ready upward.
              hard_stop = deadline + max(600, timeout_s)
              body = ""
              last = None
              saw_missing_status = False
              prev_fp = None
              stable_polls = 0
              while time.time() < hard_stop:
                  if time.time() >= deadline:
                      rc_now = _rc_token(body)
                      # Slide the deadline only while progress can still arrive.
                      if (
                          not _rc_terminal(rc_now)
                          and (_progress_obj(last) or last is None or _defer_provisional(last, rc_now))
                          and deadline < hard_stop
                      ):
                          deadline = min(hard_stop, time.time() + 30)
                      else:
                          break
                  _rc2, body = exec_cmd(
                      "sh -lc 'echo RC=$(cat /tmp/force_chunk_rc.txt 2>/dev/null || echo missing); "
                      "echo STATUS_FILE=$(cat /tmp/force_chunk_status.json 2>/dev/null || echo missing); "
                      "wc -c /tmp/force_chunk_out.txt 2>/dev/null; "
                      "tail -n 80 /tmp/force_chunk_out.txt 2>/dev/null || true'",
                      timeout=60,
                  )
                  print(body[-6000:], flush=True)
                  # Freshness: STATUS_FILE=missing proves this chunk's rm ran.
                  # Only a later STATUS_FILE={...} belongs to this chunk.
                  if "STATUS_FILE=missing" in body:
                      saw_missing_status = True
                  rc_token = _rc_token(body)
                  if saw_missing_status:
                      cand = _fresh_status(body)
                      if cand is not None and not _defer_provisional(cand, rc_token):
                          return body, cand
                  last = last_status(body)
                  fp = (
                      rc_token,
                      _out_bytes(body),
                      json.dumps(last, sort_keys=True, default=str) if isinstance(last, dict) else None,
                  )
                  if fp == prev_fp:
                      stable_polls += 1
                  else:
                      stable_polls = 0
                      prev_fp = fp
                  if not _rc_terminal(rc_token):
                      # Still running. store_ready / advance_* are not terminal.
                      if time.time() + 5 >= deadline and deadline < hard_stop and (
                          _progress_obj(last) or last is None or _defer_provisional(last, rc_token)
                      ):
                          deadline = min(hard_stop, deadline + 30)
                      time.sleep(5)
                      continue
                  # Only accept terminal JSON after we observed status missing
                  # (proves this chunk's rm ran) or after RC exists with status.
                  if saw_missing_status and _terminal_status(last) and not _defer_provisional(last, rc_token):
                      return body, last
                  # Exact RC (do not substring-match RC=137 as RC=1). A killed
                  # guest that already printed BOOTSTRAP_* is terminal.
                  if _rc_terminal(rc_token) and isinstance(last, dict) and last.get("status") in {
                      "BOOTSTRAP_FORCED", "BOOTSTRAP_PARTIAL"
                  } and not _defer_provisional(last, rc_token):
                      return body, last
                  # RC is terminal and output stopped. Do not surface the phase JSON.
                  if stable_polls >= 1 and (
                      _progress_obj(last) or _defer_provisional(last, rc_token) or not _terminal_status(last)
                  ):
                      return body, _partial_from_dead_chunk(last, rc_token)
                  time.sleep(5)
              rc_token = _rc_token(body)
              if _rc_terminal(rc_token) and not (_terminal_status(last) and not _defer_provisional(last, rc_token)):
                  return body, _partial_from_dead_chunk(last, rc_token)
              return body, last


          while elapsed < total:
              chunk += 1
              this = min(chunk_s, max(60, total - elapsed))
              print(f"CHUNK={chunk} THIS={this} ELAPSED={elapsed} BUDGET={total} CHUNK_S={chunk_s}", flush=True)
              run_cmd = (
                  "sh -lc "
                  f"'rm -f /tmp/force_chunk_out.txt /tmp/force_chunk_rc.txt /tmp/force_chunk.pid /tmp/force_chunk_status.json; "
                  f"setsid nohup sh -c \"APPLY={str(apply).lower()} EXPECTED_EPOCH={epoch} MAX_SECONDS={this} "
                  "DATA_ROOT=/app/data PYTHONUNBUFFERED=1 "
                  "python -u /tmp/fly-force-receipt-bootstrap-once.py "
                  "> /tmp/force_chunk_out.txt 2>&1; "
                  "echo \\$? > /tmp/force_chunk_rc.txt\" "
                  "</dev/null >/dev/null 2>&1 & "
                  "echo $! > /tmp/force_chunk.pid; sleep 2; "
                  "echo LAUNCHED=$(cat /tmp/force_chunk.pid); "
                  "ps -p $(cat /tmp/force_chunk.pid) -o pid=,args= || echo DEAD; "
                  "head -n 3 /tmp/force_chunk_out.txt 2>/dev/null || true'"
              )
              # Short launch exec; setsid should keep guest work alive after return.
              rc, text = exec_cmd(run_cmd, timeout=30)
              print(f"launch_rc={rc} launch_tail={text[-800:]}", flush=True)
              time.sleep(2)
              body, last = wait_chunk_result(timeout_s=max(180, this + 60))
              with open(out_path, "a", encoding="utf-8") as fh:
                  fh.write(body + ("\n" if not body.endswith("\n") else ""))
              elapsed += this
              if last is None:
                  raise SystemExit(f"no JSON from chunk {chunk}; launch_rc={rc}")
              if not apply and last.get("dry_run") is True:
                  print(json.dumps({"dry_run": "ok"}, sort_keys=True), flush=True)
                  sys.exit(0)
              if last.get("status") == "BOOTSTRAP_FORCED" and (last.get("final") or {}).get("all_complete") is True:
                  print(json.dumps({"force_bootstrap": "ok", "rounds": last.get("rounds"), "chunks": chunk}, sort_keys=True), flush=True)
                  sys.exit(0)
              if last.get("status") == "BOOTSTRAP_PARTIAL":
                  print(json.dumps({"chunk_partial": True, "chunk": chunk, "phase": last.get("phase"), "final": last.get("final"), "reason": last.get("reason")}, sort_keys=True, default=str), flush=True)
                  continue
              phase = last.get("phase") if isinstance(last, dict) else None
              if phase in _PROGRESS_PHASES or (isinstance(phase, str) and phase and not _terminal_status(last)):
                  raise SystemExit(
                      f"chunk {chunk} progress phase {phase!r} is not terminal; "
                      "no fresh BOOTSTRAP_FORCED/BOOTSTRAP_PARTIAL/dry_run"
                  )
              raise SystemExit(f"unexpected chunk status: {last}")
          raise SystemExit("budget exhausted without BOOTSTRAP_FORCED")
          PY

      - name: Wait invent publish then resume paper
        if: inputs.apply == 'true'
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          expected = os.environ["EXPECTED_REVISION"].lower()
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=90):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response: return json.load(response)
          deadline = time.time() + 1200
          last = None
          invent_ok = False
          while time.time() < deadline:
              try:
                  ready = call("/ready")
                  if ready.get("ok") is not True:
                      time.sleep(5); continue
                  call("/api/pause", {})
                  last = call("/api/status")
                  man = call("/api/data-sync/manifest?page=0&page_size=5")
                  boot = (last.get("lifecycle_pipeline") or {}).get("receipt_bootstrap") or {}
                  print(json.dumps({
                      "t": time.strftime("%H:%M:%S"),
                      "boot": boot.get("status"),
                      "boot_complete": boot.get("complete"),
                      "recs": boot.get("records_indexed"),
                      "invent": man.get("inventory_status"),
                      "ack": man.get("inventory_ack_eligible"),
                      "auth": man.get("inventory_authoritative"),
                      "files": man.get("file_count"),
                      "mib": round((man.get("total_bytes") or 0)/1048576, 2),
                      "gen": str(man.get("inventory_generation_id") or "")[:12],
                      "phase": ((man.get("inventory_worker") or {}).get("phase")),
                      "paused": last.get("execution_paused"),
                  }, sort_keys=True), flush=True)
                  if (
                      str(last.get("source_git_rev") or "").lower() == expected
                      and last.get("live_armed") is False
                      and boot.get("complete") is True
                      and man.get("inventory_status") in {"CURRENT", "STALE_REVALIDATING"}
                      and int(man.get("file_count") or 0) > 0
                  ):
                      invent_ok = True
                      break
              except Exception as exc:
                  print(f"wait: {type(exc).__name__}: {exc}", flush=True)
              time.sleep(10)
          if not invent_ok:
              raise SystemExit("invent did not publish after bootstrap: " + json.dumps(last or {}, sort_keys=True)[:4000])
          resumed = call("/api/resume", {"clear_admin_manual_pause": True})
          final = call("/api/status")
          if not (
              resumed.get("status") == "resumed"
              and final.get("execution_paused") is False
              and final.get("manual_admin_pause") is False
              and final.get("force_paper_mode") is True
              and final.get("live_armed") is False
              and str(final.get("source_git_rev") or "").lower() == expected
          ):
              raise SystemExit("resume not proven")
          print(json.dumps({"resume":"ok","NO_SAFE":True,"never_arm":True}, sort_keys=True))
          PY
