name: Fly force receipt bootstrap once

# Freeze bot writers, force emergency idempotency bootstrap to all_complete,
# then let entrypoint revive the bot. Never arms Bitfinex.
#
# Uses fly machine exec + nohup (not ssh console) — ssh console has hung for
# 15+ minutes without ever starting the freezer on this incident.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Must be true to mutate; false = probe only
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      expected_epoch:
        required: true
        default: epoch-281be253d7ee19636c6bf487
        type: string
      expected_revision:
        required: true
        default: "37f3a57a36db"
        type: string
      max_seconds:
        required: true
        default: "1200"
        type: string

jobs:
  force-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Pause paper and prove flat
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          expected = str(os.environ.get("EXPECTED_REVISION") or "").strip().lower()
          if not token: raise SystemExit("BOT_ADMIN_TOKEN missing")
          if not re.fullmatch(r"[0-9a-f]{12}", expected): raise SystemExit("bad revision")
          headers = {"X-Bot-Admin-Token": token, "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response: return json.load(response)
          status = call("/api/status")
          if str(status.get("source_git_rev") or "").lower() != expected:
              raise SystemExit(f"revision mismatch: {status.get('source_git_rev')}")
          if not (status.get("force_paper_mode") is True and status.get("bitfinex_live_enabled") is False and status.get("live_armed") is False):
              raise SystemExit("paper-only disarmed safety not proven")
          call("/api/pause", {})
          for _ in range(12):
              status = call("/api/status"); progress = status.get("strategy_progress") or {}
              if (status.get("execution_paused") is True and status.get("manual_admin_pause") is True
                  and int(progress.get("pending_orders") or 0) == 0 and int(progress.get("open_positions") or 0) == 0):
                  break
              time.sleep(2)
          else:
              raise SystemExit("flat paused boundary not proven")
          print(json.dumps({"maintenance":"flat_paused","revision":expected}, sort_keys=True))
          PY

      - name: Launch force bootstrap via machine exec + nohup
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
          EXPECTED_EPOCH: ${{ inputs.expected_epoch }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=${machine_id}"
          echo "${machine_id}" > /tmp/force_bootstrap_machine_id.txt
          script_b64="$(base64 -w0 diagnostics/fly-force-receipt-bootstrap-once.py)"
          # Drop script + start detached (machine exec wall clock is short; bootstrap is long).
          flyctl machine exec --app doxed-btc-bot --timeout 90 "${machine_id}" \
            "sh -lc 'echo ${script_b64} | base64 -d > /tmp/fly-force-receipt-bootstrap-once.py && rm -f /tmp/force_bootstrap_out.txt /tmp/force_bootstrap.done /tmp/force_bootstrap.rc /tmp/force_bootstrap.pid && nohup sh -c \"APPLY=${APPLY} EXPECTED_EPOCH=${EXPECTED_EPOCH} MAX_SECONDS=${MAX_SECONDS} DATA_ROOT=/app/data PYTHONUNBUFFERED=1 python -u /tmp/fly-force-receipt-bootstrap-once.py > /tmp/force_bootstrap_out.txt 2>&1; ec=\$?; echo \$ec > /tmp/force_bootstrap.rc; touch /tmp/force_bootstrap.done\" >/dev/null 2>&1 & echo \$! > /tmp/force_bootstrap.pid && sleep 2 && test -s /tmp/force_bootstrap.pid && echo LAUNCHED=\$(cat /tmp/force_bootstrap.pid) && head -n 2 /tmp/force_bootstrap_out.txt'"
          # Prove launcher left a live python (or finished instantly for dry-run).
          flyctl machine exec --app doxed-btc-bot --timeout 30 "${machine_id}" \
            "sh -lc 'echo PID=\$(cat /tmp/force_bootstrap.pid 2>/dev/null || echo none); head -n 3 /tmp/force_bootstrap_out.txt 2>/dev/null || true; ps -eo pid,args | grep -F fly-force-receipt-bootstrap | grep -v grep || true'"

      - name: Poll force bootstrap until done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          set -euo pipefail
          machine_id="$(cat /tmp/force_bootstrap_machine_id.txt)"
          apply="${APPLY}"
          max_seconds="${MAX_SECONDS}"
          # Poll budget = script budget + 5 minutes of slack.
          deadline=$(( $(date +%s) + max_seconds + 300 ))
          last_tail=""
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            chunk="$(flyctl machine exec --app doxed-btc-bot --timeout 45 "${machine_id}" \
              "sh -lc 'echo ---; date -u +%H:%M:%SZ; if [ -f /tmp/force_bootstrap.done ]; then echo STATE=DONE; elif [ -f /tmp/force_bootstrap.pid ] && kill -0 \$(cat /tmp/force_bootstrap.pid) 2>/dev/null; then echo STATE=RUNNING; else echo STATE=UNKNOWN; fi; tail -n 8 /tmp/force_bootstrap_out.txt 2>/dev/null || echo NO_OUT; if [ -f /tmp/force_bootstrap.out.txt ]; then true; fi; test -f /tmp/force_bootstrap.done && cat /tmp/force_bootstrap.rc || true'" 2>&1 || true)"
            # Also detect completion via out file marker lines if wrapper missed done file.
            printf '%s\n' "${chunk}"
            if printf '%s\n' "${chunk}" | grep -q 'STATE=DONE'; then
              break
            fi
            if printf '%s\n' "${chunk}" | grep -q '"status": "BOOTSTRAP_FORCED"'; then
              # Script finished; ensure done marker for next step (best-effort).
              flyctl machine exec --app doxed-btc-bot --timeout 30 "${machine_id}" \
                "sh -lc 'touch /tmp/force_bootstrap.done; echo 0 > /tmp/force_bootstrap.rc'" || true
              break
            fi
            if printf '%s\n' "${chunk}" | grep -q '"dry_run": true'; then
              flyctl machine exec --app doxed-btc-bot --timeout 30 "${machine_id}" \
                "sh -lc 'touch /tmp/force_bootstrap.done; echo 0 > /tmp/force_bootstrap.rc'" || true
              break
            fi
            if printf '%s\n' "${chunk}" | grep -Eq 'BOOTSTRAP_DEADLINE|BOOTSTRAP_NOT_COMPLETE|Traceback'; then
              echo "force-bootstrap failed in guest"
              exit 1
            fi
            sleep 15
          done
          # Fetch full output for assertion.
          flyctl machine exec --app doxed-btc-bot --timeout 60 "${machine_id}" \
            "sh -lc 'cat /tmp/force_bootstrap_out.txt'" > /tmp/force_bootstrap_out.txt
          # Wrap exit into done marker for scripts that use a shell wrapper.
          # (Launch uses bare nohup python; synthesize done from output.)
          python - <<'PY'
          import json, os
          apply = os.environ.get("APPLY", "false").strip().lower() in {"1", "true", "yes"}
          text = open("/tmp/force_bootstrap_out.txt", encoding="utf-8", errors="replace").read()
          print(text[-4000:])
          last = None
          for line in text.splitlines():
              if not line.lstrip().startswith("{"):
                  continue
              try:
                  last = json.loads(line)
              except Exception:
                  pass
          if last is None:
              raise SystemExit("no JSON from force-bootstrap script")
          if apply:
              assert last.get("ok") is True and last.get("status") == "BOOTSTRAP_FORCED", last
              final = last.get("final") or {}
              assert final.get("all_complete") is True, last
              print(json.dumps({"force_bootstrap": "ok", "rounds": last.get("rounds")}, sort_keys=True))
          else:
              assert last.get("ok") is True and last.get("dry_run") is True, last
              print(json.dumps({"dry_run": "ok"}, sort_keys=True))
          PY

      - name: Wait invent publish then resume paper
        if: inputs.apply == 'true'
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          expected = os.environ["EXPECTED_REVISION"].lower()
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=90):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response: return json.load(response)
          # Entrypoint revives bot; re-pause until invent leaves empty BUILDING.
          deadline = time.time() + 1200
          last = None
          invent_ok = False
          while time.time() < deadline:
              try:
                  ready = call("/ready")
                  if ready.get("ok") is not True:
                      time.sleep(5); continue
                  call("/api/pause", {})
                  last = call("/api/status")
                  man = call("/api/data-sync/manifest?page=0&page_size=5")
                  boot = (last.get("lifecycle_pipeline") or {}).get("receipt_bootstrap") or {}
                  print(json.dumps({
                      "t": time.strftime("%H:%M:%S"),
                      "boot": boot.get("status"),
                      "boot_complete": boot.get("complete"),
                      "recs": boot.get("records_indexed"),
                      "invent": man.get("inventory_status"),
                      "ack": man.get("inventory_ack_eligible"),
                      "auth": man.get("inventory_authoritative"),
                      "files": man.get("file_count"),
                      "mib": round((man.get("total_bytes") or 0)/1048576, 2),
                      "gen": str(man.get("inventory_generation_id") or "")[:12],
                      "phase": ((man.get("inventory_worker") or {}).get("phase")),
                      "paused": last.get("execution_paused"),
                  }, sort_keys=True), flush=True)
                  if (
                      str(last.get("source_git_rev") or "").lower() == expected
                      and last.get("live_armed") is False
                      and boot.get("complete") is True
                      and man.get("inventory_status") in {"CURRENT", "STALE_REVALIDATING"}
                      and int(man.get("file_count") or 0) > 0
                  ):
                      invent_ok = True
                      break
              except Exception as exc:
                  print(f"wait: {type(exc).__name__}: {exc}", flush=True)
              time.sleep(10)
          if not invent_ok:
              raise SystemExit("invent did not publish after bootstrap: " + json.dumps(last or {}, sort_keys=True)[:4000])
          resumed = call("/api/resume", {"clear_admin_manual_pause": True})
          final = call("/api/status")
          if not (
              resumed.get("status") == "resumed"
              and final.get("execution_paused") is False
              and final.get("manual_admin_pause") is False
              and final.get("force_paper_mode") is True
              and final.get("live_armed") is False
              and str(final.get("source_git_rev") or "").lower() == expected
          ):
              raise SystemExit("resume not proven")
          print(json.dumps({"resume":"ok","NO_SAFE":True,"never_arm":True}, sort_keys=True))
          PY
