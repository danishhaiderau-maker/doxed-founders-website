name: Fly retained volume purge once

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect only when true; delete quarantine residue when false
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      expected_epoch:
        description: Live epoch id that must never be deleted
        required: true
        default: epoch-4d795fe51650f09d4bccc872
        type: string

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect or purge retained post-wipe quarantine trees
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXPECTED_EPOCH: ${{ inputs.expected_epoch }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[row for row in rows if str(row.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=${machine_id}"
          script_b64="$(base64 -w0 diagnostics/fly-retained-volume-purge.py)"
          flyctl ssh console --app doxed-btc-bot --machine "${machine_id}" --command \
            "sh -lc 'echo ${script_b64} | base64 -d > /tmp/fly-retained-volume-purge.py && DRY_RUN=${DRY_RUN} EXPECTED_EPOCH=${EXPECTED_EPOCH} DATA_ROOT=/app/data python /tmp/fly-retained-volume-purge.py'"
