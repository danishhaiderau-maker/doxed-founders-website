name: Fly hotpatch lifecycle bootstrap early-exit once

# Hot-patch /app/lifecycle_pipeline_worker.py so all_complete bootstrap
# publishes SUCCESS before the hanging incremental pipeline. Preserves
# deployed revision (no image rebuild). Never arms Bitfinex.

on:
  workflow_dispatch:
    inputs:
      apply:
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  hotpatch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Hot-patch worker + bounce bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          mid="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1; print(active[0]["id"])')"
          echo "MACHINE_ID=$mid APPLY=$APPLY"
          test -f services/btc-conservative-agent/lifecycle_pipeline_worker.py
          grep -q bootstrap_early_exit services/btc-conservative-agent/lifecycle_pipeline_worker.py
          b64="$(base64 -w0 services/btc-conservative-agent/lifecycle_pipeline_worker.py)"
          echo "$b64" > /tmp/worker.b64
          wc -c /tmp/worker.b64
          flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
            "sh -lc 'rm -f /tmp/worker.b64 /tmp/lifecycle_pipeline_worker.py.new'"
          split -b 2800 -d /tmp/worker.b64 /tmp/worker_part_
          for part in /tmp/worker_part_*; do
            chunk="$(cat "$part")"
            flyctl machine exec --app doxed-btc-bot --timeout 30 "$mid" \
              "sh -lc 'printf %s ${chunk} >> /tmp/worker.b64'"
          done
          flyctl machine exec --app doxed-btc-bot --timeout 45 "$mid" \
            "sh -lc 'base64 -d /tmp/worker.b64 > /tmp/lifecycle_pipeline_worker.py.new && wc -c /tmp/lifecycle_pipeline_worker.py.new && grep -c bootstrap_early_exit /tmp/lifecycle_pipeline_worker.py.new'"
          if [ "$APPLY" != "true" ]; then
            echo "DRY_RUN: would install patched worker and bounce bot"
            exit 0
          fi
          flyctl machine exec --app doxed-btc-bot --timeout 60 "$mid" \
            "sh -lc '
              set -e
              test -s /tmp/lifecycle_pipeline_worker.py.new
              grep -q bootstrap_early_exit /tmp/lifecycle_pipeline_worker.py.new
              cp -a /app/lifecycle_pipeline_worker.py /app/lifecycle_pipeline_worker.py.bak.\$(date -u +%Y%m%dT%H%M%SZ) || true
              cat /tmp/lifecycle_pipeline_worker.py.new > /app/lifecycle_pipeline_worker.py
              grep -q bootstrap_early_exit /app/lifecycle_pipeline_worker.py
              wc -c /app/lifecycle_pipeline_worker.py
              # Bounce bot writers so in-memory backoff clears and new worker is used.
              for p in /proc/[0-9]*; do
                c=\$(tr \"\\0\" \" \" < \"\$p/cmdline\" 2>/dev/null || true)
                case \"\$c\" in
                  *btc_conservative_agent*|*lifecycle_pipeline_worker*|*data_sync_inventory_worker*)
                    kill -9 \$(basename \"\$p\") 2>/dev/null || true
                    ;;
                esac
              done
              echo HOTPATCH_OK
            '"
          echo "hotpatch_applied"
