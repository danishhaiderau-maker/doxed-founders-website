name: Build Founder IDE

# ─────────────────────────────────────────────────────────────────────────────
# Builds the Founder IDE Windows installer (Founder-Stack-Setup-<v>.exe) on a
# GitHub-hosted Windows runner, with every dependency pinned so the result is
# identical across runs.
#
# WHY THIS EXISTS
#   Local rebuilds kept producing broken installers:
#     - empty .build/electron cache -> launcher exe missing
#     - Python 3.13+ on PATH        -> node-gyp crashes during native extensions
#     - Node 24 instead of 20.18.2  -> ABI mismatch, native modules don't load
#     - @vscodium/policy-watcher .node missing -> "Could not locate the bindings file"
#   This pipeline pins all four and verifies the result.
#
# VOID SOURCE STRATEGY (Option B - overlay-on-clone)
#   The Founder IDE layer is small (4 files: product.json, code.iss,
#   sendLLMMessage.ts, sendFounderOs.ts). We store those 4 files verbatim in
#   packages/founder-ide/upstream/overlay/ + a MANIFEST.json, clone upstream
#   voideditor/void at the pinned commit, then run scripts/apply-founder-customizations.ps1
#   to copy the overlay on top. This is more robust than a git .patch because
#   Windows checkout flips LF->CRLF and breaks line-anchored hunks. It is also
#   how Void itself layers its overrides via void-builder.
#
# PIPELINE OVERVIEW
#   1.  checkout this monorepo
#   2.  read pins from packages/founder-ide/upstream/overlay/MANIFEST.json
#   3.  clone voideditor/void at the pinned commit, into ../vscode
#   4.  setup Node 20.18.2 + Python 3.12 + Inno Setup 6
#   5.  apply the Founder IDE overlay (scripts/apply-founder-customizations.ps1)
#   6.  cache .build/electron (the ~200MB Electron download) + node_modules + .npmrc
#   7.  npm ci (with the pinned Python on PATH for node-gyp)
#   8.  gulp vscode-win32-x64-min-ci          (compiles TS + downloads Electron + native ext)
#   9.  gulp vscode-win32-x64-user-setup      (builds the inner Founder-IDE-Setup-x64.exe)
#   10. stage the inner installer + build the outer Founder Stack bundle via iscc
#   11. compute SHA256 + size
#   12. upload as a GitHub Release asset (if triggered by tag) AND as a workflow artifact (always)
#
# DURATION
#   First run (cold): ~70-110 min (Electron download + native compile dominates).
#   Warm cache:       ~30-45 min (Electron + node_modules reused).
#
# SIGNING (0.9.2+)
#   The outer Founder-Stack-Setup-*.exe is signed with Azure Trusted Signing
#   (now branded "Azure Artifact Signing") via azure/artifact-signing-action@v2.
#   The inner FounderIDESetup.exe is also signed in place before iscc bundles
#   it. Requires 6 repo secrets (AZURE_TENANT_ID, AZURE_CLIENT_ID,
#   AZURE_CLIENT_SECRET, AZURE_TRUSTED_SIGNING_ENDPOINT,
#   AZURE_TRUSTED_SIGNING_ACCOUNT_NAME, AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME)
#   — see docs/CODE-SIGNING-GUIDE.md for account provisioning. Signing is
#   gated on `github.event_name == 'push' || !skip_release` so artifact-only
#   dev builds still produce unsigned exes for fast iteration. A later
#   signtool verify step fails the build if the final exe is unsigned on a
#   release build.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Founder Stack version to build (e.g. 0.9.2)'
        required: true
        default: '0.9.2'
      skip_release:
        description: 'Skip the GitHub Release upload (artifact-only build)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'founder-stack-v*'

# Belt-and-suspenders: never let two builds race for the same release tag.
concurrency:
  group: build-founder-ide-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed by softprops/action-gh-release to create/edit releases
  id-token: write   # needed by azure/artifact-signing-action (OIDC federation) + actions/attest-build-provenance
  attestations: write # needed by actions/attest-build-provenance to upload attestation
  packages: write   # needed by anchore/sbom-action when uploading to GHCR (we use it as artifact instead)

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      # ── 1. Checkout the monorepo (this repo) ───────────────────────────────
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Read pinned upstream commit + toolchain from MANIFEST.json ──────
      # Exposes steps.manifest.outputs.void_commit / void_repo / subdir
      - name: Read upstream pins from MANIFEST.json
        id: manifest
        shell: pwsh
        run: |
          $m = Get-Content "packages/founder-ide/upstream/overlay/MANIFEST.json" -Raw | ConvertFrom-Json
          Write-Host "Void repo    : $($m.upstream.repo)"
          Write-Host "Void commit  : $($m.upstream.commit)"
          Write-Host "Void subdir  : $($m.upstream.subdir)"
          Write-Host "Electron     : $($m.upstream.electron_version)"
          Write-Host "Node pin     : $($m.toolchain_pins.node)"
          Write-Host "Python pin   : $($m.toolchain_pins.python)"
          "void_repo=$($m.upstream.repo)"            >> $env:GITHUB_OUTPUT
          "void_commit=$($m.upstream.commit)"        >> $env:GITHUB_OUTPUT
          "void_subdir=$($m.upstream.subdir)"        >> $env:GITHUB_OUTPUT
          "electron_ver=$($m.upstream.electron_version)" >> $env:GITHUB_OUTPUT
          "node_pin=$($m.toolchain_pins.node)"       >> $env:GITHUB_OUTPUT
          "python_pin=$($m.toolchain_pins.python)"   >> $env:GITHUB_OUTPUT

      # ── 3. Resolve the build version ───────────────────────────────────────
      # Tag pushes (founder-stack-v0.9.2) -> strip the prefix.
      # Manual dispatches -> use the input verbatim.
      - name: Resolve build version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/founder-stack-v(.+)$') {
            $v = $Matches[1]
          } elseif ('${{ inputs.version }}' -ne '') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '0.0.0-dev'
          }
          Write-Host "Build version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      # ── 4. Setup Node (pinned by MANIFEST, default 20.18.2) ────────────────
      # Node 20.18.2 matches the Electron 34.3.2 ABI. Node 22/24 will compile
      # native modules against the wrong ABI and the IDE will crash on launch
      # with "Could not locate the bindings file".
      - name: Setup Node ${{ steps.manifest.outputs.node_pin }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.manifest.outputs.node_pin }}

      # ── 5. Setup Python (pinned 3.12 - NOT 3.13+) ──────────────────────────
      # node-gyp's bundled dist URL has no wheel for Python 3.13/3.14 yet, so
      # native extensions (notably @vscodium/policy-watcher, native-keymap,
      # @vscode/windows-registry) fail to compile and the IDE is unlaunchable.
      - name: Setup Python ${{ steps.manifest.outputs.python_pin }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.manifest.outputs.python_pin }}

      # ── 6. Install Inno Setup 6 (outer bundle compiler) ────────────────────
      # windows-2022 runners ship Inno Setup 6.x pre-installed at
      # C:\Program Files (x86)\Inno Setup 6\ISCC.exe. We try choco as a fallback
      # for self-hosted runners that don't, but we DON'T pin a version (choco
      # refuses to "downgrade" if a newer release is already present, and that
      # nonzero exit code fails the whole step even though ISCC.exe is fine).
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe not at $iscc - installing via choco..."
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed (exit $LASTEXITCODE)" }
          } else {
            Write-Host "ISCC.exe already installed at $iscc (skipping choco)"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still not found at $iscc after install attempt" }
          & $iscc /? 2>&1 | Select-Object -First 1
          Write-Host "ISCC ready: $iscc"

      # ── 7. Clone upstream Void at the pinned commit ────────────────────────
      # voideditor/void clones as a FLAT repo (product.json, gulpfile.js,
      # package.json at root - NOT wrapped in a vscode/ subdir). Our local
      # void-builder/vscode/ layout was just where the dev chose to clone it;
      # the actual upstream repo is flat. Cloned into ../void-src so the
      # monorepo's git status isn't polluted by ~80k VS Code files.
      - name: Clone upstream Void
        shell: pwsh
        env:
          VOID_REPO:   ${{ steps.manifest.outputs.void_repo }}
          VOID_COMMIT: ${{ steps.manifest.outputs.void_commit }}
          VOID_SUBDIR: ${{ steps.manifest.outputs.void_subdir }}
        run: |
          $voidRoot = Join-Path (Get-Location) "..\void-src"
          if (Test-Path $voidRoot) { Remove-Item -Recurse -Force $voidRoot }
          New-Item -ItemType Directory -Force -Path $voidRoot | Out-Null

          Write-Host "Cloning $env:VOID_REPO @ $env:VOID_COMMIT ..."
          # --filter=tree:0 keeps the clone small (~50MB vs ~500MB) by fetching
          # tree objects lazily. We fetch by SHA explicitly because shallow +
          # filter clones sometimes can't resolve an arbitrary SHA via checkout.
          git clone --no-tags --filter=tree:0 $env:VOID_REPO $voidRoot
          if ($LASTEXITCODE -ne 0) { throw "git clone failed" }
          git -C $voidRoot fetch --filter=tree:0 origin $env:VOID_COMMIT
          if ($LASTEXITCODE -ne 0) {
            # The commit may not be reachable from a tip fetch on a different
            # default branch; fall back to fetching all heads + the SHA.
            Write-Host "Targeted fetch failed, trying full fetch..."
            git -C $voidRoot fetch --filter=tree:0 --all
          }
          git -C $voidRoot checkout $env:VOID_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "git checkout $env:VOID_COMMIT failed" }
          $got = git -C $voidRoot rev-parse HEAD
          Write-Host "Checked out: $got"

          # void_subdir is "." for voideditor/void (flat layout). If upstream
          # ever wraps the source (like void-builder does), set subdir in MANIFEST.
          $vscodeDir = if ($env:VOID_SUBDIR -and $env:VOID_SUBDIR -ne ".") {
              Join-Path $voidRoot $env:VOID_SUBDIR
          } else { $voidRoot }

          if (-not (Test-Path (Join-Path $vscodeDir "product.json"))) {
            throw "Expected product.json under $vscodeDir (repo layout changed?)"
          }
          Write-Host "VS Code source at: $vscodeDir"
          "vscode_dir=$($vscodeDir)" >> $env:GITHUB_OUTPUT
        id: paths

      # (vscode_dir output from the clone step is used directly in subsequent steps)

      # ── 8. Apply Founder IDE overlay (product.json, code.iss, sendLLMMessage.ts, sendFounderOs.ts) ──
      - name: Apply Founder IDE overlay
        shell: pwsh
        env:
          VSCODE_CHECKOUT: ${{ steps.paths.outputs.vscode_dir }}
        run: |
          & ".\scripts\apply-founder-customizations.ps1" -VscodiumCheckout $env:VSCODE_CHECKOUT
          if ($LASTEXITCODE -ne 0) { throw "apply-founder-customizations.ps1 failed (exit $LASTEXITCODE)" }

      # ── 9. Cache Electron binary (~200MB, biggest download) ────────────────
      # Keyed on the pinned Electron version so a bump invalidates automatically.
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.vscode_dir }}\.build\electron
          key: electron-${{ runner.os }}-${{ steps.manifest.outputs.electron_ver }}-v1
          restore-keys: |
            electron-${{ runner.os }}-${{ steps.manifest.outputs.electron_ver }}-

      # ── 10. Cache node_modules ─────────────────────────────────────────────
      # Keyed on package-lock hash. Falls back to any node_modules for this OS
      # so a partial restore + npm ci is still faster than a cold install.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.vscode_dir }}\node_modules
          key: nodemodules-${{ runner.os }}-${{ steps.manifest.outputs.electron_ver }}-${{ hashFiles('packages/founder-ide/upstream/overlay/MANIFEST.json') }}
          restore-keys: |
            nodemodules-${{ runner.os }}-${{ steps.manifest.outputs.electron_ver }}-

      # ── 11. Cache native module downloads (.build/extensions) ──────────────
      # VS Code downloads prebuilt native extensions (rg, tar, @vscode/*). They
      # are keyed on the upstream commit so a Void bump picks up new versions.
      - name: Cache builtInExtensions downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.vscode_dir }}\.build\extensions
          key: builtinext-${{ runner.os }}-${{ steps.manifest.outputs.void_commit }}-v1

      # ── 12. Pin python/node on PATH for node-gyp + npm ─────────────────────
      # setup-node puts node first; setup-python puts python first. We re-export
      # so node-gyp explicitly finds Python 3.12 and not any runner default.
      - name: Verify toolchain (node/python/gulp/iscc)
        shell: pwsh
        env:
          VSCODE_CHECKOUT: ${{ steps.paths.outputs.vscode_dir }}
        run: |
          Write-Host "node    : $(node --version)"
          Write-Host "npm     : $(npm --version)"
          Write-Host "python  : $(python --version)"
          Write-Host "ISCC    : $(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')"
          # node-gyp uses the PYTHON env var if set; forces it away from any
          # runner-installed 3.13+ default.
          $env:PYTHON = (Get-Command python).Source
          Write-Host "PYTHON env -> $($env:PYTHON)"
          # Save the resolved python path for the next step via GITHUB_ENV.
          "PYTHON=$($env:PYTHON)" >> $env:GITHUB_ENV

      # ── 13. npm ci (pinned Python 3.12 active) ─────────────────────────────
      - name: npm ci (Void)
        working-directory: ${{ steps.paths.outputs.vscode_dir }}
        shell: pwsh
        run: |
          # npmrc already exists in the checkout; we just run npm ci. The
          # ELECTRON_SKIP_BINARY_DOWNLOAD flag is NOT set because gulp's
          # electron() step needs the Electron binary downloaded.
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed (exit $LASTEXITCODE)" }

      # ── 13.5. Pre-compile: build Void's React subprojects ────────────────
      # Void ships React/TSX sources under src/vs/workbench/contrib/void/browser/react/src/.
      # The main TS compile imports their compiled output via paths like
      #   './react/out/sidebar-tsx/index.js'
      # Those out/ artifacts are NOT in git (gitignored as build output) and
      # are NOT produced by any gulp target - they're built by a separate
      # script: src/vs/workbench/contrib/void/browser/react/build.js, which
      # runs `scope-tailwind` (rewrites Tailwind class names into a sandboxed
      # scope, copying src/ -> src2/) and then `tsup` (bundles each entry
      # tsx into out/<name>/index.js). Without this step the gulp compile
      # dies with 9x "Cannot find module './react/out/<name>/index.js'" errors.
      - name: Build Void React subprojects (scope-tailwind + tsup)
        working-directory: ${{ steps.paths.outputs.vscode_dir }}
        shell: pwsh
        run: |
          $reactDir = "src\vs\workbench\contrib\void\browser\react"
          if (-not (Test-Path $reactDir)) {
            Write-Host "No Void React dir at $reactDir (unexpected) - skipping"
            return
          }
          Write-Host "Building React subprojects in $reactDir ..."
          Push-Location $reactDir
          try {
            node build.js
            if ($LASTEXITCODE -ne 0) { throw "Void React build.js failed (exit $LASTEXITCODE)" }
            # Sanity-check the artifacts exist - if any are missing the next
            # step will fail with a less helpful TS error.
            $expected = @(
              "out\diff\index.js",
              "out\sidebar-tsx\index.js",
              "out\void-settings-tsx\index.js",
              "out\void-tooltip\index.js",
              "out\void-onboarding\index.js",
              "out\quick-edit-tsx\index.js",
              "out\void-editor-widgets-tsx\index.js"
            )
            foreach ($p in $expected) {
              if (-not (Test-Path $p)) { throw "Expected React build artifact missing: $p" }
            }
            Write-Host "React subprojects built OK ($($expected.Count) artifacts)"
          }
          finally { Pop-Location }

      # ── 14. Compile VS Code + download Electron + build native extensions ──
      # This is the BIG step (40-70 min cold, 20-35 min warm). Produces
      # VSCode-win32-x64/ with the launcher exe + all .node modules.
      #
      # TARGET CHOICE HISTORY:
      # 1. `vscode-win32-x64-min-ci` (original) - BROKEN. The `-ci` variant
      #    assumes `out-vscode-min/` was already produced by a separate upstream
      #    compile stage (Void's official Azure pipeline downloads a pre-built
      #    `compilation.tar.gz` before invoking any `-ci` target). We have no
      #    such upstream stage, so it crashed with ENOENT on
      #    out-vscode-min/vs/base/parts/sandbox/electron-sandbox/preload.js
      #    the moment packageTask() tried to compute checksums.
      # 2. `vscode-win32-x64-min` (second attempt) - ALSO BROKEN. This variant
      #    runs compile-build-WITH-mangling, and Void's mangler crashed 32min
      #    in with "OVERLAPPING edit" on
      #    node_modules/google-auth-library/build/src/auth/impersonated.d.ts
      #    because 16 different source paths alias the same exported symbol
      #    from that package, producing 16 colliding rename edits at one offset.
      # 3. `vscode-win32-x64` (current) - the non-minified variant. Runs
      #    compile-build-WITHOUT-mangling (skips the broken mangler entirely)
      #    and bundleVSCodeTask instead of minifyVSCodeTask. Produces
      #    `out-vscode/` (unminified) instead of `out-vscode-min/`. The output
      #    directory is then packaged into ../VSCode-win32-x64/ identically to
      #    the minified path - the setup task only cares that VSCode-win32-x64/
      #    exists, not whether its contents were minified. Tradeoff: bundle is
      #    ~20-30% larger, but a working unminified installer beats a broken
      #    minified one. See build/gulpfile.vscode.js lines 488-517.
      - name: Compile VS Code (gulp vscode-win32-x64)
        working-directory: ${{ steps.paths.outputs.vscode_dir }}
        shell: pwsh
        run: |
          npx gulp vscode-win32-x64
          if ($LASTEXITCODE -ne 0) { throw "gulp vscode-win32-x64 failed (exit $LASTEXITCODE)" }

      # ── 15. Verify the launcher + critical native modules are present ──────
      # This is the regression check for the 0.9.0 launcher-less build. Abort
      # the pipeline HERE if the launcher is missing rather than producing a
      # broken installer that bundles silently.
      #
      # PATH NOTE: gulp's packageTask() writes to `path.dirname(root)` (one
      # level ABOVE the void-src dir), NOT inside void-src. See
      # build/gulpfile.vscode.js line 229:
      #   const destination = path.join(path.dirname(root), destinationFolderName);
      # The previous version of this step looked for void-src/VSCode-win32-x64/
      # and always failed with "LAUNCHER MISSING" even on a good build.
      - name: Verify launcher + native modules
        working-directory: ${{ steps.paths.outputs.vscode_dir }}
        shell: pwsh
        run: |
          # packageTask output is one dir above the vscode checkout (the parent of void-src).
          $root = Join-Path (Get-Location) "..\VSCode-win32-x64"
          # Resolve to an absolute path without the .. segment so Test-Path / error messages are unambiguous.
          $root = (Resolve-Path -LiteralPath $root -ErrorAction SilentlyContinue)?.Path
          if (-not $root) {
            throw "VSCode-win32-x64 output directory not found at expected location (one dir above void-src). gulp packageTask() did not run?"
          }
          Write-Host "Packaged output root: $root"
          $launcher = Join-Path $root "Founder IDE.exe"
          if (-not (Test-Path $launcher)) {
            Write-Host "--- contents of $root (first 40 entries) ---"
            Get-ChildItem -LiteralPath $root -ErrorAction SilentlyContinue | Select-Object -First 40 | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "LAUNCHER MISSING: $launcher (the gulp electron() step must have failed silently)"
          }
          $len = (Get-Item $launcher).Length
          Write-Host "Launcher OK: $launcher ($([math]::Round($len/1MB,1)) MB)"
          if ($len -lt 50MB) {
            throw "Launcher suspiciously small ($len bytes) - Electron binary missing"
          }

          # Critical native modules that have regressed in past builds.
          # NOTE on paths/names:
          #  - Void uses @vscode/policy-watcher (Microsoft's official package),
          #    NOT @vscodium/policy-watcher (the VSCodium fork).
          #  - The actual binary filename is `vscode-policy-watcher.node`
          #    (with the `vscode-` prefix and a hyphen), per
          #    build/.moduleignore line 133. The previous version of this list
          #    assumed `policy_watcher.node` and always failed.
          #  - The other 3 use `*.node` wildcards because build/.moduleignore
          #    itself uses wildcards for them, so we don't hardcode an exact
          #    binary name that might drift.
          $requiredNode = @(
            "resources\app\node_modules\@vscode\policy-watcher\build\Release\vscode-policy-watcher.node",
            "resources\app\node_modules\native-keymap\build\Release\*.node",
            "resources\app\node_modules\@vscode\windows-registry\build\Release\*.node",
            "resources\app\node_modules\@vscode\windows-process-tree\build\Release\*.node"
          )
          foreach ($n in $requiredNode) {
            $p = Join-Path $root $n
            # Use -Path (not -LiteralPath) so the *.node wildcards work.
            $match = Get-ChildItem -Path $p -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $match) {
              $parent = Split-Path -Parent $p
              if (Test-Path $parent) {
                Write-Host "--- contents of $parent ---"
                Get-ChildItem -LiteralPath $parent -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.Name)" }
              } else {
                Write-Host "Parent dir does not exist: $parent"
              }
              throw "NATIVE MODULE MISSING: $n (the IDE will crash with 'Could not locate the bindings file')"
            }
            Write-Host "  native OK: $n -> $($match.FullName)"
          }
          Write-Host "All native modules present."

      # ── 16. Build the inner installer (Founder-IDE-Setup-x64.exe) ──────────
      - name: Build inner installer (gulp vscode-win32-x64-user-setup)
        working-directory: ${{ steps.paths.outputs.vscode_dir }}
        shell: pwsh
        run: |
          npx gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { throw "gulp vscode-win32-x64-user-setup failed (exit $LASTEXITCODE)" }

      # ── 16.1. Sign the inner installer (Azure Trusted Signing) ────────────
      # Signs FounderIDESetup.exe in place BEFORE iscc bundles it, so the
      # outer bundle contains a signed inner installer. Gated on release builds
      # (push events or skip_release=false) so artifact-only dev builds skip
      # signing for faster iteration. Requires the 6 AZURE_* secrets — see
      # docs/CODE-SIGNING-GUIDE.md. If secrets are absent the step is skipped
      # (so fork PRs can still build), and a later signtool verify step fails
      # the build only on release builds.
      - name: Sign inner installer (Azure Trusted Signing)
        if: ${{ (github.event_name == 'push') && (secrets.AZURE_TENANT_ID != '') && (secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '') }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id:             ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:             ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:         ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                    ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name:    ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder:                ${{ steps.paths.outputs.vscode_dir }}\.build\win32-x64\user-setup
          files-folder-filter:         exe
          file-digest:                 SHA256
          timestamp-rfc3161:           http://timestamp.acs.microsoft.com
          timestamp-digest:            SHA256

      # ── 16.5. Build Founder Node (electron-builder --win) ──────────────────
      # Founder Node is re-bundled in 0.9.2: the IDE Gateway client requires
      # ~/FounderVault/node-config.json, which only Founder Node creates on
      # first pairing. Built here so the outer Inno Setup can stage it as a
      # sub-installer.
      #
      # WORKSPACE BUILD ORDER MATTERS. Founder Node imports workspace packages
      # (@dcf/founder-vault, @dcf/utils — see apps/founder-node/package.json
      # "dependencies"). Those packages must be installed AND built before
      # `tsc` can resolve their type declarations. The pattern mirrors
      # .github/workflows/founder-node-release.yml:
      #   1. npm ci at the REPO ROOT (installs workspace symlinks so
      #      @dcf/founder-vault / @dcf/utils resolve)
      #   2. npm run build:utils (builds @dcf/utils then @dcf/founder-vault)
      #   3. descend into apps/founder-node for its tsc + electron-builder
      # Without step 1+2, `tsc -p apps/founder-node` crashes with
      # "Cannot find module '@dcf/founder-vault'" (TS2307) — see CI run
      # 29578049272.
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false disables electron-builder's
      # auto-signing (the OUTER bundle is signed by Azure Trusted Signing in
      # a later step; we don't double-sign the inner NSIS).
      - name: Build Founder Node (electron-builder --win)
        shell: pwsh
        run: |
          # 1. Root install — sets up workspace symlinks so @dcf/* resolves.
          #    The repo's packageManager is npm@10.9.2 (engines: node>=20);
          #    the runner's Node 20.18.2 ships a compatible npm.
          Write-Host "npm ci (repo root — workspace install)..."
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "root npm ci failed (exit $LASTEXITCODE)" }

          # 2. Build the workspace packages Founder Node imports.
          #    `build:utils` is defined at the repo root and runs
          #    `npm run build --workspace=@dcf/utils` then
          #    `npm run build --workspace=@dcf/founder-vault`.
          Write-Host "npm run build:utils (workspace deps)..."
          npm run build:utils
          if ($LASTEXITCODE -ne 0) { throw "build:utils failed (exit $LASTEXITCODE)" }

          # 2b. Generate Founder Node app/tray icons (PNG + ICO).
          #     Without this, electron-builder fails with
          #     `cannot find specified resource "build/icon.ico"` because the
          #     icon files are not committed (they're generated artifacts).
          #     Mirrors .github/workflows/founder-node-release.yml step
          #     "Generate app icons" -> scripts/generate-founder-node-icon.mjs.
          Write-Host "Generating Founder Node icons..."
          node scripts/generate-founder-node-icon.mjs
          if ($LASTEXITCODE -ne 0) { throw "icon generation failed (exit $LASTEXITCODE)" }

          # 3. Build Founder Node itself (tsc) + package it (electron-builder).
          $nodeDir = "apps\founder-node"
          if (-not (Test-Path (Join-Path $nodeDir "package.json"))) {
            throw "Founder Node not found at $nodeDir"
          }
          Push-Location $nodeDir
          try {
            Write-Host "npm run build (founder-node tsc)..."
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Founder Node build failed (exit $LASTEXITCODE)" }
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
            Write-Host "electron-builder --win --x64..."
            npx electron-builder --win --x64 --publish never
            if ($LASTEXITCODE -ne 0) { throw "electron-builder --win failed (exit $LASTEXITCODE)" }
          } finally { Pop-Location }

          $nodeExe = Get-ChildItem -Path (Join-Path $nodeDir "release") -Filter "Founder-Node-*.exe" -ErrorAction Stop |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $nodeExe) { throw "Founder Node setup .exe not produced in $nodeDir\release" }
          Write-Host "Founder Node installer: $($nodeExe.FullName) ($([math]::Round($nodeExe.Length/1MB,1)) MB)"

          # Stage with the stable name the outer .iss expects.
          $staging = Join-Path (Get-Location) "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $stagedNode = Join-Path $staging "Founder-Node-win-x64.exe"
          Copy-Item $nodeExe.FullName $stagedNode -Force
          Write-Host "Staged Founder Node -> $stagedNode"
          "founder_node_setup=$stagedNode" >> $env:GITHUB_OUTPUT
        id: founder_node

      # ── 17. Stage the inner installer + run the outer Inno Setup ───────────
      # The outer .iss expects Founder-IDE-Setup-x64.exe at a known staging path.
      # We resolve the freshly built FounderIDESetup.exe and copy it there.
      # Founder Node (built in the previous step) is also passed via
      # /DFOUNDER_NODE_SETUP so the outer .iss can bundle it as a sub-installer.
      - name: Build outer Founder Stack installer (iscc)
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          FOUNDER_NODE_SETUP: ${{ steps.founder_node.outputs.founder_node_setup }}
        run: |
          $vscode   = "${{ steps.paths.outputs.vscode_dir }}"
          $innerDir = Join-Path $vscode ".build\win32-x64\user-setup"
          $innerExe = Get-ChildItem $innerDir -Filter "FounderIDESetup.exe" -ErrorAction Stop | Select-Object -First 1
          Write-Host "Inner installer: $($innerExe.FullName) ($([math]::Round($innerExe.Length/1MB,1)) MB)"

          # Stage into the location the outer .iss expects.
          $staging = Join-Path (Get-Location) "staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $stagedInner = Join-Path $staging "Founder-IDE-Setup-x64.exe"
          Copy-Item $innerExe.FullName $stagedInner -Force

          # Founder Node was staged by the previous step.
          $stagedNode = $env:FOUNDER_NODE_SETUP
          if (-not (Test-Path $stagedNode)) { throw "Founder Node setup not staged at $stagedNode" }
          Write-Host "Founder Node staged at: $stagedNode"

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $iss  = "packages\founder-ide\installer\founder-stack.iss"
          if (-not (Test-Path $iss)) { throw "Outer .iss not found at $iss" }

          # ISCC: pass paths with forward slashes. ISCC's #define substitution
          # treats `\` as an escape inside string literals (e.g. `\D:` is read
          # as a "filename prefix"), so Windows-style backslash paths produce
          # "Unknown filename prefix" compile errors. Forward slashes work
          # everywhere Inno Setup reads a path.
          $stagedInnerFwd = $stagedInner -replace '\\','/'
          $stagedNodeFwd  = $stagedNode  -replace '\\','/'

          # ISCC preprocessor treats `\` as an escape char in defines.
          # Embedded quotes in `/DNAME="value"` produce `\` + `"` which ISCC
          # parses as the literal `\D:` — "Unknown filename prefix". The .iss
          # already wraps each Source path in its own quotes (line 132/134),
          # and CI paths contain no spaces, so we pass the raw forward-slash
          # path with no extra quoting.
          Write-Host "Running iscc for Founder Stack $env:VERSION ..."
          Write-Host "  FOUNDER_IDE_SETUP  = $stagedInnerFwd"
          Write-Host "  FOUNDER_NODE_SETUP = $stagedNodeFwd"
          & $iscc `
            "/DFOUNDER_STACK_VERSION=$env:VERSION" `
            "/DFOUNDER_IDE_SETUP=$stagedInnerFwd" `
            "/DFOUNDER_NODE_SETUP=$stagedNodeFwd" `
            $iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed (exit $LASTEXITCODE)" }

          # Output goes to packages/founder-ide/installer/dist/ (per the .iss OutputDir).
          $distDir = "packages\founder-ide\installer\dist"
          $bundle  = Get-ChildItem $distDir -Filter "Founder-Stack-Setup-*.exe" |
                     Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $bundle) { throw "Founder Stack installer not found in $distDir after iscc" }
          Write-Host "Outer installer: $($bundle.FullName) ($([math]::Round($bundle.Length/1MB,1)) MB)"
          "bundle_path=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          "bundle_name=$($bundle.Name)"     >> $env:GITHUB_OUTPUT
          "dist_dir=$distDir"               >> $env:GITHUB_OUTPUT
        id: iscc

      # ── 17.5. Sign the outer installer (Azure Trusted Signing) ────────────
      # Signs Founder-Stack-Setup-<v>.exe in place. Gated on release builds
      # AND on Azure Trusted Signing credentials being provisioned. When the
      # 6 AZURE_* secrets are absent (fork PRs, dev sandbox, externally
      # blocked per Rule 7), the step is skipped and the verify step below
      # runs in advisory mode — the pipeline produces a clearly-marked
      # unsigned artifact for installer-validation work, while still refusing
      # to publish a release. See docs/CODE-SIGNING-GUIDE.md.
      - name: Sign outer installer (Azure Trusted Signing)
        if: ${{ (github.event_name == 'push') && (secrets.AZURE_TENANT_ID != '') && (secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '') }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id:             ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:             ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret:         ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint:                    ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name:    ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          files-folder:                ${{ steps.iscc.outputs.dist_dir }}
          files-folder-filter:         exe
          file-digest:                 SHA256
          timestamp-rfc3161:           http://timestamp.acs.microsoft.com
          timestamp-digest:            SHA256

      # ── 17.6. Verify signature with signtool (release builds) ─────────────
      # windows-2022 runners ship signtool.exe under the Windows Kits. We
      # locate it via Get-ChildItem (the SDK version directory drifts across
      # runner images). On release builds this step fails the build if the
      # outer exe is unsigned. On artifact-only builds it runs in advisory
      # mode (continue-on-error) so dev builds don't fail just because no
      # Azure cert is configured.
      - name: Verify signature (signtool)
        shell: pwsh
        env:
          BUNDLE_PATH: ${{ steps.iscc.outputs.bundle_path }}
          # IS_RELEASE=true only on real release pushes where Azure creds are
          # provisioned (i.e. signing was actually expected to run). When creds
          # are absent the signing step skips cleanly and we run verify in
          # advisory mode — the build still produces a usable unsigned artifact
          # for installer validation, while the release-publish step downstream
          # separately hard-refuses to publish an unsigned release.
          IS_RELEASE: ${{ (github.event_name == 'push') && (secrets.AZURE_TENANT_ID != '') && (secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '') }}
        run: |
          $exe = $env:BUNDLE_PATH
          if (-not (Test-Path $exe)) { throw "Installer missing at $exe" }

          # Locate signtool.exe — the SDK version dir drifts across runner images.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) {
            Write-Host "signtool.exe not found under C:\Program Files (x86)\Windows Kits\10\bin\*\x64\ — skipping verification"
            if ([string]$env:IS_RELEASE -eq 'true') { throw "signtool.exe not found on runner" }
            return
          }
          Write-Host "Using signtool: $($signtool.FullName)"

          # /pa = use Public Authenticode policy; /v = verbose.
          & $signtool.FullName verify /pa /v $exe
          $verifyExit = $LASTEXITCODE
          if ($verifyExit -eq 0) {
            Write-Host "SIGNATURE OK: $exe is signed and trusted" -ForegroundColor Green
          } else {
            Write-Host "SIGNATURE MISSING OR INVALID on $exe (signtool exit $verifyExit)" -ForegroundColor Yellow
            if ([string]$env:IS_RELEASE -eq 'true') {
              throw "Release build is unsigned — Azure Trusted Signing secrets may be missing or invalid"
            } else {
              Write-Host "Non-release build — continuing (advisory only)"
            }
          }

      # ── 18. Compute SHA256 + size ──────────────────────────────────────────
      - name: Compute SHA256 + size
        id: hash
        shell: pwsh
        run: |
          $exe = "${{ steps.iscc.outputs.bundle_path }}"
          if (-not (Test-Path $exe)) { throw "Installer missing at $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $exe).Length
          Write-Host "SHA256 : $hash"
          Write-Host "Size   : $size bytes ($([math]::Round($size/1MB,1)) MB)"
          Write-Host "Path   : $exe"
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size"   >> $env:GITHUB_OUTPUT
          "path=$exe"    >> $env:GITHUB_OUTPUT

      # ── 19. Upload as a workflow artifact (always, even on non-release builds) ──
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Founder-Stack-Setup-${{ steps.ver.outputs.version }}
          path: ${{ steps.hash.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ── 20. Upload SHA256 sidecar artifact (for manifest updates) ──────────
      - name: Write + upload SHA256 sidecar
        shell: pwsh
        run: |
          $sidecar = "Founder-Stack-Setup-${{ steps.ver.outputs.version }}.exe.sha256"
          "${{ steps.hash.outputs.sha256 }}  Founder-Stack-Setup-${{ steps.ver.outputs.version }}.exe" | Set-Content -Path $sidecar -NoNewline -Encoding ascii
          Write-Host "Wrote $sidecar"
      - name: Upload SHA256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: Founder-Stack-Setup-${{ steps.ver.outputs.version }}-sha256
          path: Founder-Stack-Setup-${{ steps.ver.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 30

      # ── 20.5. Generate SBOM (SPDX) via anchore/sbom-action ────────────────
      # Produces a SPDX JSON SBOM for the monorepo and uploads it as both a
      # workflow artifact and (on release builds) a release asset. The SBOM
      # lets downstream users audit the transitive dependency tree of the
      # installer. We scan the whole monorepo (not just the installer) because
      # Founder Node + the IDE extension are bundled into the installer.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: founder-stack-${{ steps.ver.outputs.version }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Founder-Stack-Setup-${{ steps.ver.outputs.version }}-sbom
          path: founder-stack-${{ steps.ver.outputs.version }}-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 30

      # ── 20.6. Build provenance attestation (sigstore) ─────────────────────
      # Creates a sigstore-backed attestation tying the installer artifact to
      # this workflow run. Verifiable with `gh attestation verify` downstream.
      # Requires id-token: write (added above) and an artifact present in the
      # run. We attest the outer installer exe by digest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.hash.outputs.path }}
          subject-name: founder-stack-setup
          push-to-registry: false

      # ── 21. Attach to GitHub Release (only for tag pushes or non-skipped dispatches) ──
      - name: Upload to GitHub Release
        if: ${{ (github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && !inputs.skip_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: founder-stack-v${{ steps.ver.outputs.version }}
          name: Founder Stack ${{ steps.ver.outputs.version }}
          body: |
            # Founder Stack ${{ steps.ver.outputs.version }}

            Built by GitHub Actions run ${{ github.run_id }}.

            - **File:** `${{ steps.hash.outputs.path }}`
            - **Size:** ${{ steps.hash.outputs.size }} bytes
            - **SHA-256:** `${{ steps.hash.outputs.sha256 }}`
            - **Signing:** Signed with Azure Trusted Signing when the build runs
              with the `AZURE_*` secrets configured. Verify with
              `signtool verify /pa /v <file>` (Windows) or check the signature
              tab in File Properties. Fork PR builds without secrets produce an
              unsigned exe (SmartScreen will warn).
            - **SBOM:** see `founder-stack-${{ steps.ver.outputs.version }}-sbom.spdx.json` below.
            - **Provenance:** verify with
              `gh attestation verify <file> --repo ${{ github.repository }}`.

            See `packages/founder-ide/RELEASES.md` in the repo for release notes.
          files: |
            ${{ steps.hash.outputs.path }}
            Founder-Stack-Setup-${{ steps.ver.outputs.version }}.exe.sha256
            founder-stack-${{ steps.ver.outputs.version }}-sbom.spdx.json
          fail_on_unmatched_files: false

      # ── 22. Final summary ──────────────────────────────────────────────────
      - name: Build summary
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host " Founder Stack ${{ steps.ver.outputs.version }} BUILD OK"
          Write-Host "============================================================"
          Write-Host " Installer  : ${{ steps.hash.outputs.path }}"
          Write-Host " Size       : ${{ steps.hash.outputs.size }} bytes"
          Write-Host " SHA-256    : ${{ steps.hash.outputs.sha256 }}"
          Write-Host " Artifact   : Founder-Stack-Setup-${{ steps.ver.outputs.version }}"
          Write-Host "============================================================"
