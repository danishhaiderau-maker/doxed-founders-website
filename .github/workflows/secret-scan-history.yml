name: Secret Scan (full history)

# The PR/push scan in secret-scan.yml checks the working tree only. This daily
# job scans every commit on every branch; known historical findings are listed
# by fingerprint in .gitleaksignore, so only a new leak fails the run.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-history
  cancel-in-progress: true

jobs:
  gitleaks-history:
    name: gitleaks (all branches, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout all branches
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git . --log-opts="--all" --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose
