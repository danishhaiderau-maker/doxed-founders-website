name: Fly repair lifecycle incomplete tail once

# One-shot: quarantine incomplete lifecycle.jsonl tail via in-place ftruncate
# (inode preserved). Never arms Bitfinex. Soft-cap unchanged.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Must be true to mutate; false = dry-run probe only
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      expected_physical_size:
        required: true
        type: string
      expected_published_size:
        required: true
        type: string
      expected_source_sha256:
        required: true
        type: string
      expected_prefix_sha256:
        required: true
        type: string
      expected_tail_size:
        required: true
        type: string
      expected_tail_sha256:
        required: true
        type: string
      expected_inode:
        required: true
        type: string
      expected_mtime_ns:
        required: true
        type: string
      expected_revision:
        description: Exact 12-char deployed source_git_rev
        required: true
        default: "37f3a57a36db"
        type: string
      restart_after:
        description: Restart machine after APPLY repair to clear lifecycle TIMEOUT backoff
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Pause paper, prove flat, repair incomplete lifecycle tail
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APPLY: ${{ inputs.apply }}
          EXPECTED_PHYSICAL_SIZE: ${{ inputs.expected_physical_size }}
          EXPECTED_PUBLISHED_SIZE: ${{ inputs.expected_published_size }}
          EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
          EXPECTED_PREFIX_SHA256: ${{ inputs.expected_prefix_sha256 }}
          EXPECTED_TAIL_SIZE: ${{ inputs.expected_tail_size }}
          EXPECTED_TAIL_SHA256: ${{ inputs.expected_tail_sha256 }}
          EXPECTED_INODE: ${{ inputs.expected_inode }}
          EXPECTED_MTIME_NS: ${{ inputs.expected_mtime_ns }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          RESTART_AFTER: ${{ inputs.restart_after }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          token = str(os.environ.get("BOT_ADMIN_TOKEN") or "").strip()
          expected = str(os.environ.get("EXPECTED_REVISION") or "").strip().lower()
          if not token:
              raise SystemExit("BOT_ADMIN_TOKEN missing")
          if not re.fullmatch(r"[0-9a-f]{12}", expected):
              raise SystemExit("expected_revision must be 12 hex chars")
          headers = {"X-Bot-Admin-Token": token, "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path, data=data,
                  headers={**headers, **({"Content-Type": "application/json"} if data else {})},
                  method="POST" if data is not None else "GET",
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)
          status = call("/api/status")
          if str(status.get("source_git_rev") or "").lower() != expected:
              raise SystemExit(f"revision mismatch: {status.get('source_git_rev')}")
          if not (
              status.get("force_paper_mode") is True
              and status.get("bitfinex_live_enabled") is False
              and status.get("live_armed") is False
          ):
              raise SystemExit("paper-only disarmed safety not proven")
          call("/api/pause", {})
          for _ in range(12):
              status = call("/api/status")
              progress = status.get("strategy_progress") or {}
              if (
                  status.get("execution_paused") is True
                  and status.get("manual_admin_pause") is True
                  and int(progress.get("pending_orders") or 0) == 0
                  and int(progress.get("open_positions") or 0) == 0
              ):
                  break
              time.sleep(2)
          else:
              raise SystemExit("flat paused boundary not proven")
          print(json.dumps({"maintenance": "flat_paused", "revision": expected}, sort_keys=True))
          PY

          machine_id="$(flyctl machines list --app doxed-btc-bot --json | python -c 'import json,sys; rows=json.load(sys.stdin); active=[r for r in rows if str(r.get("state") or "").lower() not in {"destroyed","stopped"}]; assert len(active)==1, active; print(active[0]["id"])')"
          echo "MACHINE_ID=${machine_id}"
          script_b64="$(base64 -w0 diagnostics/fly-repair-lifecycle-incomplete-tail-once.py)"
          repair_output="$(flyctl ssh console --app doxed-btc-bot --machine "${machine_id}" --command \
            "sh -lc 'echo ${script_b64} | base64 -d > /tmp/fly-repair-lifecycle-incomplete-tail-once.py && APPLY=${APPLY} EXPECTED_PHYSICAL_SIZE=${EXPECTED_PHYSICAL_SIZE} EXPECTED_PUBLISHED_SIZE=${EXPECTED_PUBLISHED_SIZE} EXPECTED_SOURCE_SHA256=${EXPECTED_SOURCE_SHA256} EXPECTED_PREFIX_SHA256=${EXPECTED_PREFIX_SHA256} EXPECTED_TAIL_SIZE=${EXPECTED_TAIL_SIZE} EXPECTED_TAIL_SHA256=${EXPECTED_TAIL_SHA256} EXPECTED_INODE=${EXPECTED_INODE} EXPECTED_MTIME_NS=${EXPECTED_MTIME_NS} DATA_ROOT=/app/data python /tmp/fly-repair-lifecycle-incomplete-tail-once.py'")"
          printf '%s\n' "$repair_output"
          if [ "${APPLY}" = "true" ]; then
            printf '%s' "$repair_output" | python -c 'import json,sys; lines=[x for x in sys.stdin if x.lstrip().startswith("{")];
last=None
for line in lines:
  try: last=json.loads(line)
  except Exception: pass
assert last and last.get("ok") is True and last.get("status")=="REPAIRED" and last.get("inode_preserved") is True, last
print(json.dumps({"repair":"ok","active_size":last.get("active_size")},sort_keys=True))'
          else:
            printf '%s' "$repair_output" | python -c 'import json,sys; lines=[x for x in sys.stdin if x.lstrip().startswith("{")];
last=None
for line in lines:
  try: last=json.loads(line)
  except Exception: pass
assert last and last.get("ok") is True and last.get("dry_run") is True, last
print(json.dumps({"dry_run":"ok"},sort_keys=True))'

          if [ "${APPLY}" = "true" ] && [ "${RESTART_AFTER}" = "true" ]; then
            echo "Restarting machine to clear lifecycle TIMEOUT backoff"
            flyctl machines restart --app doxed-btc-bot "$machine_id"
            python - <<'PY'
          import json, os, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          expected = os.environ["EXPECTED_REVISION"].lower()
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=60):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)
          # Wait for process ready, then re-pause (restart clears in-memory pause).
          deadline = time.time() + 180
          while time.time() < deadline:
              try:
                  ready = call("/ready")
                  status = call("/api/status")
                  if ready.get("ok") is True and str(status.get("source_git_rev") or "").lower() == expected:
                      call("/api/pause", {})
                      time.sleep(2)
                      status = call("/api/status")
                      if status.get("execution_paused") is True and status.get("manual_admin_pause") is True:
                          print(json.dumps({"restart":"ready_re_paused","revision":expected}, sort_keys=True))
                          break
              except Exception as exc:
                  print(f"waiting ready: {type(exc).__name__}", flush=True)
              time.sleep(5)
          else:
              raise SystemExit("post-restart ready+pause not proven")
          PY
          fi

      - name: Prove receipt_bootstrap advances then resume paper
        if: inputs.apply == 'true'
        env:
          BOT_ADMIN_TOKEN: ${{ secrets.BOT_ADMIN_TOKEN }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = "https://doxed-btc-bot.fly.dev"
          expected = os.environ["EXPECTED_REVISION"].lower()
          headers = {"X-Bot-Admin-Token": os.environ["BOT_ADMIN_TOKEN"], "Cache-Control": "no-cache"}
          def call(path, payload=None, timeout=90):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base+path, data=data, headers={**headers, **({"Content-Type":"application/json"} if data else {})}, method="POST" if data is not None else "GET")
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.load(response)
          deadline = time.time() + 1500
          last = None
          saw_success = 0
          invent_current = False
          while time.time() < deadline:
              try:
                  call("/api/pause", {})
                  last = call("/api/status")
                  man = call("/api/data-sync/manifest?page=0&page_size=5")
                  pipeline = last.get("lifecycle_pipeline") or {}
                  boot = pipeline.get("receipt_bootstrap") or {}
                  progress = pipeline.get("progress") or {}
                  safe = (
                      str(last.get("source_git_rev") or "").lower() == expected
                      and last.get("force_paper_mode") is True
                      and last.get("bitfinex_live_enabled") is False
                      and last.get("live_armed") is False
                      and last.get("execution_paused") is True
                  )
                  outcome = pipeline.get("last_outcome")
                  print(json.dumps({
                      "t": time.strftime("%H:%M:%S"),
                      "outcome": outcome,
                      "err": pipeline.get("last_error_code"),
                      "fail": pipeline.get("last_failure_code"),
                      "boot": boot.get("status"),
                      "boot_complete": boot.get("complete"),
                      "recs": boot.get("records_indexed"),
                      "rows": progress.get("rows_scanned"),
                      "bytes": progress.get("bytes_indexed"),
                      "invent": man.get("inventory_status"),
                      "ack": man.get("inventory_ack_eligible"),
                      "files": man.get("file_count"),
                      "mib": round((man.get("total_bytes") or 0) / 1048576, 2),
                      "gen": str(man.get("inventory_generation_id") or "")[:12],
                      "phase": ((man.get("inventory_worker") or {}).get("phase")),
                  }, sort_keys=True), flush=True)
                  if not safe:
                      time.sleep(10); continue
                  if outcome in {"SUCCESS", "WORKER_SUCCESS"} and (
                      int(progress.get("rows_scanned") or 0) > 0
                      or int(boot.get("records_indexed") or 0) > 0
                      or boot.get("complete") is True
                  ):
                      saw_success += 1
                  if boot.get("complete") is True and boot.get("status") == "COMPLETE":
                      # Invent may still be building after bootstrap; wait for non-empty publish.
                      if man.get("inventory_status") in {"CURRENT", "STALE_REVALIDATING"} and int(man.get("file_count") or 0) > 0:
                          invent_current = True
                          break
                      if saw_success >= 2 and man.get("inventory_status") != "BUILDING":
                          invent_current = True
                          break
                  if outcome == "WORKER_FAILED" and pipeline.get("last_error_code") not in {
                      None, "TRUNCATED_JSONL_LINE", "TIMEOUT"
                  }:
                      # Allow brief post-restart TIMEOUT; hard-fail other blockers.
                      if pipeline.get("last_error_code") not in {"TIMEOUT"}:
                          raise SystemExit("new blocker: " + json.dumps(pipeline, sort_keys=True)[:2000])
              except Exception as exc:
                  print(f"proof wait: {type(exc).__name__}: {exc}", flush=True)
              time.sleep(15)
          else:
              raise SystemExit("bootstrap/invent proof deadline: " + json.dumps(last or {}, sort_keys=True)[:4000])

          if not invent_current:
              # Bootstrap complete is the hard gate; invent may still be scanning.
              boot = (last.get("lifecycle_pipeline") or {}).get("receipt_bootstrap") or {}
              if boot.get("complete") is not True:
                  raise SystemExit("receipt_bootstrap not complete")

          resumed = call("/api/resume", {})
          final = call("/api/status")
          if not (
              resumed.get("status") == "resumed"
              and final.get("execution_paused") is False
              and final.get("manual_admin_pause") is False
              and final.get("force_paper_mode") is True
              and final.get("bitfinex_live_enabled") is False
              and final.get("live_armed") is False
              and str(final.get("source_git_rev") or "").lower() == expected
          ):
              raise SystemExit("paper resume not proven")
          print(json.dumps({"resume": "ok", "NO_SAFE": True, "never_arm": True}, sort_keys=True))
          PY
