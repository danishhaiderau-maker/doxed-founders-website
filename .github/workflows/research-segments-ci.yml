name: Research segments (shadow) CI

on:
  pull_request:
    paths:
      - "services/btc-conservative-agent/research_segment_*.py"
      - "services/btc-conservative-agent/test_research_segments*.py"
      - "services/btc-conservative-agent/research_fresh_start_wipe.py"
      - "services/btc-conservative-agent/test_research_fresh_start_wipe.py"
      - "scripts/research_segment_fly_parity.py"
      - "scripts/fly_postdeploy_active_gate.py"
      - "scripts/test_fly_postdeploy_active_gate.py"
      - "services/btc-conservative-agent/fly-entrypoint.sh"
      - "services/btc-conservative-agent/fly.toml"
      - "services/btc-conservative-agent/Dockerfile"
      - "scripts/research-segment-pull*.ps1"
      - "scripts/run-segment-analyzer-cycle.ps1"
      - "scripts/laptop-chain-*.ps1"
      - "scripts/laptop_chain_incident.py"
      - "scripts/test_laptop_chain_incident.py"
      - "scripts/laptop-status-snapshots.ps1"
      - "scripts/unattended_proof.py"
      - "scripts/test_unattended_proof.py"
      - "tests/test_laptop_chain_scripts.py"
      - "services/btc-conservative-agent/test_legacy_data_sync_retirement.py"
      - ".github/workflows/research-segments-ci.yml"

permissions:
  contents: read

jobs:
  segments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipper/puller/parity have no third-party runtime dependencies
        run: python -I -c "import sys; sys.path.insert(0, '.'); import research_segment_format, research_segment_selection, research_segment_store, research_segment_shipper, research_segment_puller, research_segment_parity, research_segment_server, research_segment_prune, research_segment_promotion, research_fresh_start_wipe"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest test_research_segments.py test_research_segments_volume.py test_research_segments_promotion.py test_research_segments_epoch.py test_research_fresh_start_wipe.py -q
      - run: python -m pytest ../../scripts/test_fly_postdeploy_active_gate.py ../../scripts/test_fly_failure_paper_resume.py -q
      - run: python -m pytest test_fly_startup_contract.py test_fly_runtime_baseline_packaging.py test_legacy_data_sync_retirement.py -q
      - run: python -m pytest ../../scripts/test_laptop_chain_incident.py ../../scripts/test_unattended_proof.py ../../tests/test_laptop_chain_scripts.py -q
      - name: Entrypoint shell syntax
        run: bash -n fly-entrypoint.sh
