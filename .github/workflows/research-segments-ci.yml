name: Research segments (shadow) CI

on:
  pull_request:
    paths:
      - "services/btc-conservative-agent/research_segment_*.py"
      - "services/btc-conservative-agent/test_research_segments*.py"
      - "services/btc-conservative-agent/fly-entrypoint.sh"
      - "services/btc-conservative-agent/fly.toml"
      - "services/btc-conservative-agent/Dockerfile"
      - "scripts/research-segment-pull*.ps1"
      - ".github/workflows/research-segments-ci.yml"

permissions:
  contents: read

jobs:
  segments:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/btc-conservative-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipper/puller/parity have no third-party runtime dependencies
        run: python -I -c "import sys; sys.path.insert(0, '.'); import research_segment_format, research_segment_store, research_segment_shipper, research_segment_puller, research_segment_parity, research_segment_server, research_segment_prune"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest test_research_segments.py test_research_segments_volume.py -q
      - run: python -m pytest test_fly_startup_contract.py test_fly_runtime_baseline_packaging.py -q
      - name: Entrypoint shell syntax
        run: bash -n fly-entrypoint.sh
