name: Bitfinex production gate

on:
  push:
    branches: [master, main]
    paths-ignore:
      # Memory-sync noise from founder-os agent (1-line tasks.json changes)
      # was burning ~64% of monthly Actions minutes. Skip the gate for these.
      - '.github/founder-os/**'
      # Docs and rules don't touch trading code
      - 'docs/**'
      - '**/*.md'
      - '**/.cursor/rules/**'
      # Bot research artifacts (handled by separate sync workflow)
      - 'services/btc-conservative-agent/**'
      - '.edge-analysis/**'
  pull_request:

jobs:
  bitfinex-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/verify-bitfinex-production-lock.mjs
      - run: node scripts/verify-bitfinex-policy-lock.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/btc-conservative-agent/requirements.txt pytest
      # The btc-signal-engine byte-copy mirror was removed (POST-FREEZE PR-C);
      # the behavioural combo-fixture + import-flag probe runs on the canonical bot.
      - run: python scripts/signal_probe.py --full
